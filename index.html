<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Compass</title>
<meta name="description" content="Plan, review, grow and reflect — gently, on any device.">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
/* Soft, bright, quiet. Each section has its own pastel; everything else stays out of the way. */
:root{
  --bg:#FAF7F2;--surface:#FFFFFF;--soft:#F3EFE9;--ink:#2E2B33;--muted:#8C8693;--faint:#BDB7C2;--line:#EEE8E1;
  --plan:#6C9BC9;--plan-t:#E2EDF8;--review:#D88F5C;--review-t:#FBE8D8;--growth:#57A07A;--growth-t:#DCEFE3;--reflect:#8D7FCF;--reflect-t:#EAE6F8;
  --m1:#E9A3A8;--m2:#F1BE97;--m3:#EDD58C;--m4:#A6D6AF;--m5:#92C4E9;
  --blob:#F9E4DC;--danger:#C9615F;
  --shadow:0 1px 2px rgba(46,43,51,.04),0 6px 22px rgba(46,43,51,.06);
  --shadow-lg:0 18px 50px rgba(46,43,51,.16);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--plan);--tint:var(--plan-t);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161C;--surface:#211F28;--soft:#2A2832;--ink:#ECE8F2;--muted:#9C97A8;--faint:#5E596A;--line:#2F2C37;
  --plan:#93B9E0;--plan-t:#1E2836;--review:#E8AD82;--review-t:#33281F;--growth:#86C3A2;--growth-t:#1C2C24;--reflect:#B3A7EA;--reflect-t:#29253D;
  --blob:#2A2130;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);--shadow-lg:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161C;--surface:#211F28;--soft:#2A2832;--ink:#ECE8F2;--muted:#9C97A8;--faint:#5E596A;--line:#2F2C37;
  --plan:#93B9E0;--plan-t:#1E2836;--review:#E8AD82;--review-t:#33281F;--growth:#86C3A2;--growth-t:#1C2C24;--reflect:#B3A7EA;--reflect-t:#29253D;
  --blob:#2A2130;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);--shadow-lg:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}
body[data-tab="review"]{--accent:var(--review);--tint:var(--review-t)}
body[data-tab="growth"]{--accent:var(--growth);--tint:var(--growth-t)}
body[data-tab="reflect"]{--accent:var(--reflect);--tint:var(--reflect-t)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 var(--sans);color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 42vmax at -5% -10%,var(--tint),transparent 70%),radial-gradient(50vmax 36vmax at 105% 4%,var(--blob),transparent 70%)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:1180px}
main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}

/* header */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 18px 4px;max-width:680px;margin:0 auto}
body[data-tab="growth"] header.top{max-width:1180px}
.hello{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
.todayline{color:var(--muted);font-size:14px;margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.ring{width:16px;height:16px}.ring circle{fill:none;stroke-width:2.4}.ring .rb{stroke:var(--line)}.ring .rf{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn[aria-pressed="true"]{color:var(--accent);background:var(--tint)}

/* tabs: thumb-reach bar on phones, quiet row on wider screens */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;transition:background .2s,color .2s}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--tint)}
@media (min-width:760px){
  nav.tabs{position:static;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 18px 0}
  nav.tabs button{flex:none;max-width:none;flex-direction:row;gap:8px;font-size:14.5px;padding:9px 18px}
  main{padding-bottom:48px}
}

/* scope + period */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 4px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:1px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--muted);font-weight:500;white-space:nowrap;transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pnav{display:flex;align-items:flex-end;gap:8px;margin:16px 2px 12px}
.pnav h2,.h2{font-family:var(--serif);font-weight:500;font-size:31px;margin:0;letter-spacing:-.015em;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.pnav .arrows{margin-left:auto;display:flex;align-items:center;gap:2px}
.link{color:var(--accent);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:10px}
.link:hover{background:var(--tint)}

/* lists */
.add{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);margin:6px 0 16px}
.add input{flex:1;border:0;outline:0;background:none;padding:10px 0;font-size:15.5px;min-width:0}
.add button{width:38px;height:38px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 15px;border-top:1px solid var(--line);transition:opacity .3s}
.task:first-child{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;transition:all .2s}
.tick:hover{border-color:var(--accent)}
.tick svg{width:13px;height:13px;stroke-width:2.8}
.task.done .tick,.task.ticking .tick{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.task.ticking .tick{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.ttext{flex:1;outline:0;min-width:0;word-break:break-word;border-radius:6px}
.ttext:focus{background:var(--soft);box-shadow:0 0 0 4px var(--soft)}
.task.done .ttext,.task.ticking .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.chip{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px;flex:none;margin-top:1px;white-space:nowrap}
.chip.late{color:var(--review);background:var(--review-t)}
.more{width:28px;height:28px;border-radius:8px;color:var(--faint);display:grid;place-items:center;flex:none;margin:-3px 0}
.more:hover{background:var(--soft);color:var(--ink)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 4px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button.label{width:calc(100% - 8px)}
.empty{padding:24px 20px;color:var(--muted);text-align:center;font-family:var(--serif);font-style:italic;font-size:16.5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.week button{background:var(--surface);border-radius:14px;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted)}
.week b{font-size:16px;color:var(--ink);font-weight:600}
.week .on{background:var(--tint)}.week .on b{color:var(--accent)}
.dots{display:flex;gap:3px;height:6px;align-items:center}.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75}

/* review */
.mood{display:flex;gap:6px;justify-content:space-between;background:var(--surface);border-radius:18px;padding:16px 10px 12px;box-shadow:var(--shadow)}
.mood button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mood i{width:34px;height:34px;border-radius:50%;background:var(--c);opacity:.4;transition:all .25s;display:block}
.mood button:hover i{opacity:.7}
.mood button[aria-pressed="true"] i{opacity:1;transform:scale(1.1);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--c)}
.mood button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.field{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 12px;margin-top:12px;display:block}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:3px}
textarea.auto{width:100%;border:0;outline:0;background:none;resize:none;min-height:26px;font-size:15.5px;line-height:1.6;padding:0;overflow:hidden;display:block}
.rituals{display:flex;flex-wrap:wrap;gap:8px}
.rit{padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;display:inline-flex;gap:7px;align-items:center;transition:all .2s}
.rit i{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;color:transparent}
.rit i svg{width:11px;height:11px;stroke-width:3}
.rit[aria-pressed="true"]{background:var(--growth-t);color:var(--growth)}
.rit[aria-pressed="true"] i{background:var(--growth);border-color:var(--growth);color:var(--surface)}
.rhythm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.rhythm button{width:16px;height:16px;border-radius:50%;background:var(--line)}
.rhythm button.fut{opacity:.35}
.rhythm button.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rhythm.months button{width:auto;height:auto;border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink)}
details.field summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.field summary::-webkit-details-marker{display:none}
.win{font-family:var(--serif);font-size:17px}
.donelist{margin:10px 0 2px;padding:0;list-style:none;color:var(--muted);font-size:14.5px}
.donelist li{padding:5px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.donelist li::before{content:"✓";color:var(--growth)}

/* reflect */
.quick{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 10px;margin:18px 0 18px}
.quick textarea{font-family:var(--serif);font-size:19px;line-height:1.5;min-height:58px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.kinds{display:flex;gap:2px}
.kind{padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.kind[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.btn{background:var(--accent);color:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg.i{width:16px;height:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.tint{background:var(--tint);color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.tools .btn{height:38px}
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:0 10px;box-shadow:var(--shadow);color:var(--muted);height:38px;flex:1;min-width:0}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.entry{display:block;width:100%;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;transition:transform .15s}
.entry:hover{transform:translateY(-1px)}
.eh{display:flex;gap:9px;align-items:center}
.eh h3{margin:0;font-size:15.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eh time{font-size:12px;color:var(--faint);flex:none}
.kdot{width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.entry p{margin:4px 0 0 17px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
.obar{position:sticky;top:0;display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:3}
.obar .sp{flex:1}
.otitle{font-family:var(--serif);font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 6px}
.editor{max-width:680px;margin:0 auto;padding:6px 24px 90px}
.when{color:var(--muted);font-size:13px}
input.title{width:100%;border:0;outline:0;background:none;font-family:var(--serif);font-size:31px;font-weight:500;padding:6px 0 4px;letter-spacing:-.01em}
textarea.body{font-size:17px;line-height:1.75;min-height:55vh}
.settings section{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px;margin:0 0 14px}
.settings h3{margin:0 0 4px;font-size:16px}
.settings p{margin:0 0 12px;color:var(--muted);font-size:14px}
.settings .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.settings .add{box-shadow:none;background:var(--soft);margin:10px 0 0}
.settings input.tok{flex:1;min-width:0;border:0;outline:0;background:var(--soft);border-radius:12px;padding:10px 12px}
.ritrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ritrow:first-child{border-top:0}.ritrow span{flex:1}
.ok{color:var(--growth)}.bad{color:var(--danger)}

.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(30,26,36,.3);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:16px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet-back{align-items:center}.sheet{border-radius:22px;padding-bottom:12px}}
.sheet h4{margin:0 12px 10px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.opt{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:15px;text-align:left;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--tint);color:var(--accent);font-weight:600}
.opt.danger{color:var(--danger)}
.opt input{margin-left:auto;border:0;background:var(--soft);border-radius:10px;padding:6px 8px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;display:flex;gap:16px;align-items:center;z-index:95;box-shadow:var(--shadow-lg);animation:fade .2s;max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media (min-width:760px){.toast{bottom:28px}}

/* mind map */
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 2px 12px}
.mapwrap{position:relative;height:calc(100dvh - 250px);min-height:380px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
@media (min-width:760px){.mapwrap{height:calc(100dvh - 230px)}}
.overlay.mapov{overflow:hidden;display:flex;flex-direction:column}
.overlay.mapov .mapwrap{flex:1;height:auto;min-height:0;border-radius:0;box-shadow:none;background:transparent}
.mm-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;outline:0;cursor:grab;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px}
.mm-viewport.panning{cursor:grabbing}
.mm-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.mm-canvas.smooth{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mm-lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.mm-lines path{fill:none;stroke-linecap:round;opacity:.9}
.mm-node{position:absolute;left:0;top:0;white-space:pre-wrap;word-break:break-word;max-width:250px;width:max-content;cursor:pointer;user-select:none;-webkit-user-select:none;outline:0;transition:box-shadow .15s;line-height:1.35}
.mm-node.d0{background:var(--ink);color:var(--bg);font-family:var(--serif);font-size:20px;font-weight:500;padding:13px 26px;border-radius:20px;max-width:300px;text-align:center}
.mm-node.d1{background:color-mix(in srgb,var(--c) 32%,var(--surface));border:1.5px solid var(--c);font-weight:600;font-size:15px;padding:8px 16px;border-radius:14px}
.mm-node.d2{padding:3px 4px 5px;font-size:14px;border-bottom:2px solid var(--c)}
.mm-node.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.mm-node.d2.sel{border-radius:6px}
.mm-node.editing{user-select:text;-webkit-user-select:text;cursor:text;min-width:60px}
.mm-node:empty::before{content:"Type an idea";color:var(--faint);font-weight:400}
.mm-node.d0:empty::before{color:var(--muted)}
.mm-node[data-n]::after{content:attr(data-n);position:absolute;top:50%;right:-28px;transform:translateY(-50%);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--c);color:var(--ink);font:600 11px/20px var(--sans);text-align:center}
.mm-node[data-side="-1"][data-n]::after{right:auto;left:-28px}
.mm-tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:4px;box-shadow:var(--shadow-lg);z-index:2}

/* ======== periods: day · week · month · year ======== */
/* A task's `when` is a period key: "2026-11-03" (day), "2026-W45" (week), "2026-11" (month), "2026" (year) or "" (someday). */
const SCOPES=[["day","Day"],["week","Week"],["month","Month"],["year","Year"]];
function keyOf(scope,d){
  if(scope==="day")return ymd(d);
  if(scope==="week"){const w=isoWeek(d);return w.y+"-W"+pad(w.w)}
  if(scope==="month")return d.getFullYear()+"-"+pad(d.getMonth()+1);
  if(scope==="year")return String(d.getFullYear());
  return "";
}
function span(key){
  let m;if(!key)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(key))return{scope:"day",s:key,e:key};
  if((m=key.match(/^(\d{4})-W(\d{2})$/))){const a=weekStart(+m[1],+m[2]);return{scope:"week",s:ymd(a),e:ymd(addDays(a,6))}}
  if((m=key.match(/^(\d{4})-(\d{2})$/)))return{scope:"month",s:key+"-01",e:ymd(new Date(+m[1],+m[2],0))};
  if(/^\d{4}$/.test(key))return{scope:"year",s:key+"-01-01",e:key+"-12-31"};
  return null;
}
function period(scope,d){
  const key=keyOf(scope,d),sp=span(key),now=new Date(),cur=key===keyOf(scope,now);let title="",sub="";
  if(scope==="day"){const n=diffDays(todayK(),key);title=n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":fmt(d,{weekday:"long"});
    sub=fmt(d,Object.assign({day:"numeric",month:"long"},Math.abs(n)<=1?{weekday:"long"}:{},d.getFullYear()!==now.getFullYear()?{year:"numeric"}:{}))}
  else if(scope==="week"){const n=diffDays(ymd(weekStart(+key.slice(0,4),+key.slice(6))),ymd(weekStart(isoWeek(now).y,isoWeek(now).w)));
    title=cur?"This week":n===-7?"Next week":n===7?"Last week":"Week "+(+key.slice(6));
    sub=fmt(parse(sp.s),{day:"numeric",month:"short"})+" – "+fmt(parse(sp.e),{day:"numeric",month:"short"})}
  else if(scope==="month"){title=fmt(d,{month:"long"});sub=cur?"This month":String(d.getFullYear())}
  else{title=key;sub=cur?"This year":""}
  return{scope,key,s:sp.s,e:sp.e,title,sub,cur};
}
function shift(scope,d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(scope==="day")x.setDate(x.getDate()+n);else if(scope==="week")x.setDate(x.getDate()+7*n);
  else if(scope==="month")x.setMonth(x.getMonth()+n,1);else x.setFullYear(x.getFullYear()+n,0,1);return x}
function whenChip(key){
  if(!key)return"Someday";const sp=span(key);if(!sp)return"";const now=new Date();
  if(sp.scope==="day"){const n=diffDays(todayK(),key);if(n===0)return"Today";if(n===1)return"Tomorrow";if(n===-1)return"Yesterday";
    if(n>1&&n<7)return fmt(parse(key),{weekday:"short"});return fmt(parse(key),{day:"numeric",month:"short"})}
  if(sp.scope==="week"){if(key===keyOf("week",now))return"This week";if(key===keyOf("week",addDays(now,7)))return"Next week";return"Week "+(+key.slice(6))}
  if(sp.scope==="month")return fmt(parse(sp.s),{month:"short"})+(key.slice(0,4)!==String(now.getFullYear())?" "+key.slice(0,4):"");
  return key;
}

/* ======== storage ======== */
/* Local-first: saved in this browser on every edit. Optional sync keeps a private GitHub gist as the
   shared copy across devices. Records carry _t (last edit) and deletions leave dated markers, so two
   devices merge cleanly and the newer edit of the same record wins. */
const LKEY="compass-lite",OLDKEY="lifecompass3",SKEY="compass-sync",OLDSKEY="lifecompass-sync",TKEY="compass-theme",UKEY="compass-ui";
const FILE="compass.json",OLDFILE="lifecompass.json";
const COLS=["tasks","logs","notes","meta"];
let S={tasks:{},logs:{},notes:{},meta:{},deleted:{},savedAt:0};
let saveT=null;
function snapshot(){const o={app:"compass",v:1,savedAt:S.savedAt,deleted:S.deleted};COLS.forEach(c=>o[c]=S[c]);return o}
function applyData(o){COLS.forEach(c=>S[c]=o[c]||{});S.deleted=o.deleted||{};S.savedAt=o.savedAt||0}
function persist(){clearTimeout(saveT);saveT=null;S.savedAt=Date.now();
  try{localStorage.setItem(LKEY,JSON.stringify(snapshot()))}catch(e){toast(e&&e.name==="QuotaExceededError"?"Storage is full — export your data and clear old entries":"Couldn't save just now — it will retry on your next edit")}
  Sync.soon()}
function touch(col,id){const o=S[col][id];if(o)o._t=Date.now();clearTimeout(saveT);saveT=setTimeout(persist,300)}
function drop(col,id){delete S[col][id];S.deleted[col+"/"+id]=Date.now();clearTimeout(saveT);saveT=setTimeout(persist,150)}
function restore(col,obj){S[col][obj.id||obj.key]=obj;delete S.deleted[col+"/"+(obj.id||obj.key)];touch(col,obj.id||obj.key)}
function flush(){if(saveT)persist()}
function mergeIn(r){
  let changed=false,ahead=false;const del=S.deleted,rdel=r.deleted||{},t=o=>(o&&o._t)||0;
  Object.entries(rdel).forEach(([p,x])=>{if(!del[p]||del[p]<x)del[p]=x});
  Object.keys(del).forEach(p=>{if(!rdel[p]||rdel[p]<del[p])ahead=true});
  COLS.forEach(col=>{const R=r[col]||{},L=S[col]=S[col]||{};
    Object.keys(R).forEach(id=>{const d=del[col+"/"+id];if(d&&d>=t(R[id]))return;if(!L[id]||t(R[id])>t(L[id])){L[id]=R[id];changed=true}});
    Object.keys(L).forEach(id=>{const d=del[col+"/"+id];if(d&&d>=t(L[id])){delete L[id];changed=true;return}if(!R[id]||t(L[id])>t(R[id]))ahead=true})});
  const cut=Date.now()-365*864e5;Object.keys(del).forEach(p=>{if(del[p]<cut)delete del[p]});
  return{changed,ahead};

const Sync={
  t:null,running:false,again:false,state:"",msg:"",
  cfg(){try{return JSON.parse(lsGet(SKEY)||"null")}catch(e){return null}},
  setCfg(c){lsSet(SKEY,c?JSON.stringify(c):null)},
  on(){const c=this.cfg();return!!(c&&c.token&&c.gist)},
  soon(){if(!this.on())return;clearTimeout(this.t);this.t=setTimeout(()=>{this.t=null;this.run()},2500)},
  async api(path,opt){const c=this.cfg()||{};
    const r=await fetch("https://api.github.com"+path,Object.assign({cache:"no-store"},opt,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}}));
    if(!r.ok){const e=new Error("GitHub said "+r.status);e.status=r.status;throw e}return r.status===204?null:r.json()},
  async file(f){if(!f)return null;let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}return txt?JSON.parse(txt):null},
  async pull(){const g=await this.api("/gists/"+this.cfg().gist);const fs=g.files||{};return{data:await this.file(fs[FILE]),legacy:fs[FILE]?null:await this.file(fs[OLDFILE])}},
  push(){return this.api("/gists/"+this.cfg().gist,{method:"PATCH",body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(snapshot())}}})})},
  async run(){
    if(!this.on())return;if(this.running){this.again=true;return}this.running=true;
    try{
      flush();const{data,legacy}=await this.pull();let m={changed:false,ahead:!data};
      if(data)m=mergeIn(data);else if(legacy&&!S.meta.migrated){migrate(legacy);m={changed:true,ahead:true}}
      if(m.changed){persistQuiet();softRender()}
      if(m.ahead)await this.push();
      const c=this.cfg();if(c){c.last=Date.now();this.setCfg(c)}
      this.state="ok";this.msg="";
    }catch(e){this.state="err";
      this.msg=e.status===401||e.status===403?"GitHub rejected the token — reconnect below":e.status===404?"The sync gist is gone — reconnect below":navigator.onLine===false?"Offline — your changes are safe here and will sync later":"Couldn't sync just now — will retry"}
    finally{this.running=false;if(this.again){this.again=false;this.soon()}paintSettings()}
  },
  async connect(token){
    this.setCfg({token});let gist=null,old=null;
    for(let page=1;page<=10&&!gist;page++){const list=await this.api("/gists?per_page=100&page="+page);if(!list||!list.length)break;
      const g=list.find(x=>x.files&&x.files[FILE]);if(g)gist=g.id;else if(!old){const o=list.find(x=>x.files&&x.files[OLDFILE]);if(o)old=o.id}}
    gist=gist||old;
    if(!gist){const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:"Life Compass — my data (private, synced by the app)",public:false,files:{[FILE]:{content:JSON.stringify(snapshot())}}})});gist=g.id}
    this.setCfg({token,gist});await this.run();
  },
  disconnect(){this.setCfg(null);this.state="";this.msg=""}
};
function persistQuiet(){try{S.savedAt=Date.now();localStorage.setItem(LKEY,JSON.stringify(snapshot()))}catch(e){}}

/* ======== moving over from the earlier, bigger version ======== */
const toMs=v=>typeof v==="number"?v:typeof v==="string"&&v?parse(v.slice(0,10)).getTime():0;
function migrate(o){
  const now=Date.now(),T=x=>Object.assign(x,{_t:now});
  Object.values(o.tasks||{}).forEach(t=>{if(!t||!t.id||!t.text||S.tasks[t.id])return;
    S.tasks[t.id]=T({id:t.id,text:t.text,when:t.due||"",done:!!t.done,doneAt:t.done?(toMs(t.doneAt)||t.created||now):0,created:t.created||now})});
  Object.values(o.events||{}).forEach(ev=>{if(!ev||!ev.id||!ev.title||S.tasks[ev.id])return;const past=(ev.date||"")<todayK();
    S.tasks[ev.id]=T({id:ev.id,text:ev.title+(ev.time?" · "+ev.time:""),when:ev.date||"",done:past,doneAt:past?toMs(ev.date):0,created:ev.created||now})});
  const kmap={daily:"journal",journal:"journal",idea:"idea"};
  Object.values(o.notes||{}).forEach(n=>{if(!n||!n.id||S.notes[n.id])return;if(!n.title&&!n.body)return;
    S.notes[n.id]=T({id:n.id,kind:kmap[n.kind]||"note",title:n.title||"",body:n.body||"",pinned:!!n.pinned,created:n.created||now,updated:n.updated||n.created||now})});
  const habits=((o.plan&&o.plan.areas)||[]).flatMap(a=>a.habits||[]).filter(h=>h&&h.id&&h.type!=="num"&&h.type!=="scale").slice(0,10);
  if(habits.length&&!(S.meta.rituals&&S.meta.rituals.list&&S.meta.rituals.list.length))S.meta.rituals=T({id:"rituals",list:habits.map(h=>({id:h.id,label:h.label||h.name||"Ritual"}))});
  const rit=new Set(((S.meta.rituals||{}).list||[]).map(r=>r.id));
  Object.entries(o.days||{}).forEach(([k,d])=>{if(!d||S.logs[k]||!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
    const L={key:k,mood:typeof d.rating==="number"&&d.rating>0?clamp(Math.round(d.rating/2),1,5):0,wins:[d.note,d.phrase].filter(Boolean).join("\n"),learn:d.lesson||"",next:"",r:{}};
    Object.entries(d.v||{}).forEach(([h,v])=>{if(v===true&&rit.has(h))L.r[h]=true});
    if(L.mood||L.wins||L.learn||Object.keys(L.r).length)S.logs[k]=T(L)});
  Object.entries(o.reviews||{}).forEach(([k,r])=>{if(!r)return;const text=Object.entries(r).filter(([f,v])=>typeof v==="string"&&v.trim()&&!["key","symbol"].includes(f)).map(([,v])=>v.trim()).join("\n\n");
    if(!text)return;
    if(span(k)&&!S.logs[k])S.logs[k]=T({key:k,mood:0,wins:text,learn:"",next:"",r:{}});
    else if(!span(k)){const id="rv-"+k;if(!S.notes[id])S.notes[id]=T({id,kind:"journal",title:"Review · "+k,body:text,pinned:false,created:now,updated:now})}});
  const g=S.meta.growth;if(!g||g.seeded){const tree=growthFromOld(o);if(tree)S.meta.growth=T({id:"growth",root:tree})}
  S.meta.migrated=T({id:"migrated",at:now});
}
const SPHERES=[["Roots",["spirit","health","inner"]],["Circles",["close","service","network"]],["Craft",["edu","creative","career","money"]]];
const AREA_NAMES={spirit:"Spiritual",health:"Health",inner:"Inner life",close:"Close bonds",service:"Service",network:"Network",edu:"Learning",creative:"Creative",career:"Career",money:"Money"};
const node=(text,children)=>({id:uid(),text,children:children||[]});
function growthFromOld(o){
  const areas=(o.plan&&o.plan.areas)||[];if(!areas.length&&!(o.lists&&o.lists.goals||[]).length)return null;
  const by={};const put=(a,t)=>{if(!t)return;(by[a||"_"]=by[a||"_"]||[]).push(node(t))};

/* Each line becomes a branch; indentation (spaces, tabs or "- " bullets) makes sub-branches. */
function outlineToTree(title,text){
  const lines=String(text||"").split("\n").filter(l=>l.trim());

  if(!root.text&&lines.length)root.text=lines.shift().replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").trim();
  const stack=[{n:root,ind:-1}];
  lines.forEach(line=>{const m=line.match(/^(\s*)(?:[-*•]|\d+[.)])?\s*(.*)$/),ind=m[1].replace(/\t/g,"    ").length,txt=m[2].trim();if(!txt)return;
    const c=node(txt);while(stack.length>1&&stack[stack.length-1].ind>=ind)stack.pop();stack[stack.length-1].n.children.push(c);stack.push({n:c,ind})});
  return root;
}

/* ======== Presentation (XMind "pitch"-style: one topic per slide, its ideas as cards) ======== */
function present(root){
  const slides=[],idx=new Map();
  (function walk(n,path,color){const kids=n.children||[];if(!path.length||kids.length){idx.set(n.id,slides.length);slides.push({n,path,color})}
    kids.forEach((c,i)=>walk(c,path.concat(n.text),path.length?color:PAL[i%PAL.length]))})(root,[],PAL[2]);
  const z=document.createElement("div");z.className="pz";z.setAttribute("role","dialog");z.setAttribute("aria-label","Presentation");
  z.innerHTML=`<div class="pz-prog"></div><button class="iconbtn pz-close" data-p="close" aria-label="Close presentation">${icon("x")}</button><div class="pz-stage"></div>
    <div class="pz-bar"><button data-p="prev" aria-label="Previous">${icon("left")}</button><span class="pz-count"></span><button data-p="next" aria-label="Next">${icon("right")}</button></div>`;
  document.body.appendChild(z);document.body.classList.add("locked");
  let i=-1;
  const card=(c,j,color)=>{const kids=c.children||[];return`<div class="pcard${kids.length?" go":""}" style="--i:${j};--c:${color}"${kids.length?` data-goto="${idx.get(c.id)}"`:""}><div>${esc(c.text)}</div>${kids.length?`<ul>${kids.slice(0,4).map(k=>`<li>${esc(k.text)}</li>`).join("")}${kids.length>4?`<li>${kids.length-4} more</li>`:""}</ul>`:""}</div>`};
  function show(n){
    if(n<0||n>=slides.length||n===i)return;const dir=n>i?1:-1,old=$(".slide:not(.leaving)",z);i=n;const s=slides[n],isRoot=!s.path.length,kids=s.n.children||[];
    const el=document.createElement("section");el.className="slide"+(isRoot?" root":"")+(kids.length<=3?" few":"")+(dir>0?" enter-r":" enter-l");el.style.setProperty("--c",s.color);
    el.innerHTML=`<div class="crumbs">${s.path.map(esc).join(" &nbsp;›&nbsp; ")}</div><h1>${esc(s.n.text||"Untitled")}</h1><div class="cards">${kids.map((c,j)=>card(c,j,isRoot?PAL[j%PAL.length]:s.color)).join("")}</div>`;
    $(".pz-stage",z).appendChild(el);el.getBoundingClientRect();requestAnimationFrame(()=>el.classList.remove("enter-r","enter-l"));
    if(old){old.classList.add("leaving",dir>0?"leave-l":"leave-r");setTimeout(()=>old.remove(),600)}
    z.style.setProperty("--c",s.color);$(".pz-count",z).textContent=(n+1)+" / "+slides.length;$(".pz-prog",z).style.width=((n+1)/slides.length*100)+"%";
  }
  const close=()=>{document.removeEventListener("keydown",key,true);const ix=layers.indexOf(close);if(ix>-1)layers.splice(ix,1);
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});z.remove();if(!$(".overlay"))document.body.classList.remove("locked")};
  const key=e=>{const k=e.key;
    if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k)){e.preventDefault();e.stopPropagation();show(i+1)}
    else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){e.preventDefault();e.stopPropagation();show(i-1)}
    else if(k==="Home"){e.preventDefault();show(0)}else if(k==="End"){e.preventDefault();show(slides.length-1)}
    else if(k==="Escape"){e.preventDefault();e.stopPropagation();close()}};
  document.addEventListener("keydown",key,true);layers.push(close);

  z.addEventListener("pointerdown",e=>{sx=e.clientX;swiped=false});
  z.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50){swiped=true;show(i+(dx<0?1:-1))}});
  z.addEventListener("click",e=>{if(swiped){swiped=false;return}const p=e.target.closest("[data-p]"),g=e.target.closest("[data-goto]");
    if(p){const a=p.dataset.p;if(a==="close")close();else show(i+(a==="next"?1:-1));return}
    if(g){show(+g.dataset.goto);return}
    show(e.clientX<innerWidth/3?i-1:i+1)});
  if(z.requestFullscreen&&matchMedia("(min-width:760px)").matches)z.requestFullscreen().catch(()=>{});
  show(0);
}

/* ======== overlays, sheets, toasts ======== */
function overlay(html,cls){const o=document.createElement("div");o.className="overlay "+(cls||"");o.innerHTML=html;document.body.appendChild(o);document.body.classList.add("locked");
  const close=()=>o._close?o._close():closeOverlay(o);o._layer=close;layers.push(close);return o}
function closeOverlay(o){const ix=layers.indexOf(o._layer);if(ix>-1)layers.splice(ix,1);o.remove();if(!$(".overlay")&&!$(".pz"))document.body.classList.remove("locked");if(!layers.length&&pendingRender)setTimeout(softRender)}
function sheet(html,bind){closeSheet();const b=document.createElement("div");b.className="sheet-back";b.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
  b.onclick=e=>{if(e.target===b)closeSheet()};document.body.appendChild(b);layers.push(closeSheet);bind&&bind(b)}
function closeSheet(){const b=$(".sheet-back");if(b)b.remove();const ix=layers.indexOf(closeSheet);if(ix>-1)layers.splice(ix,1)}
let toastT=null;
function toast(msg,undo){const old=$(".toast");if(old)old.remove();clearTimeout(toastT);const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${undo?"<button>Undo</button>":""}`;if(undo)t.querySelector("button").onclick=()=>{t.remove();undo()};
  document.body.appendChild(t);toastT=setTimeout(()=>t.remove(),5000)}

/* ======== settings ======== */
let settingsEl=null;
function theme(){return lsGet(TKEY)||"auto"}
function applyTheme(){const t=theme();if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
function openSettings(){
  settingsEl=overlay(`<div class="obar"><button class="iconbtn" data-x="close" aria-label="Back">${icon("back")}</button><div class="otitle">Settings</div></div><div class="editor settings"></div>`);
  const o=settingsEl;o._close=()=>{closeOverlay(o);settingsEl=null;render()};
  o.addEventListener("click",async e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x;
    if(x==="close")o._close();
    else if(x==="theme"){lsSet(TKEY,b.dataset.v);applyTheme();paintSettings()}
    else if(x==="rdel"){const R=S.meta.rituals;R.list=R.list.filter(r=>r.id!==b.dataset.v);touch("meta","rituals");paintSettings()}
    else if(x==="connect"){const tok=$("input.tok",o).value.trim();if(!tok)return;b.disabled=true;b.textContent="Connecting…";
      try{await Sync.connect(tok);toast("Sync is on ✓")}catch(err){Sync.setCfg(null);toast(err.status===401?"That token didn't work — check it has the gist permission":"Couldn't reach GitHub — try again")}paintSettings()}
    else if(x==="syncnow"){Sync.run()}
    else if(x==="disconnect"){Sync.disconnect();paintSettings()}
    else if(x==="export"){flush();const blob=new Blob([JSON.stringify(snapshot(),null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="life-compass-"+todayK()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}});
  o.addEventListener("submit",e=>{e.preventDefault();const inp=$("input",e.target),v=inp.value.trim();if(!v)return;
    const R=S.meta.rituals=S.meta.rituals||{id:"rituals",list:[]};R.list=(R.list||[]).concat({id:uid(),label:v});touch("meta","rituals");paintSettings();$(".ritform input",o).focus()});
  o.addEventListener("change",e=>{if(e.target.type!=="file"||!e.target.files[0])return;const fr=new FileReader();
    fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.app==="compass")mergeIn(d);else if(d.app==="lifecompass"||d.tasks||d.days)migrate(d);else throw 0;persist();toast("Imported ✓")}catch(err){toast("That file doesn't look like a Life Compass export")}};
    fr.readAsText(e.target.files[0])});
  paintSettings();
}
function paintSettings(){
  const o=settingsEl;if(!o)return;const box=$(".editor",o),c=Sync.cfg(),on=Sync.on(),t=theme();
  const ago=c&&c.last?Math.round((Date.now()-c.last)/6e4):null;
  box.innerHTML=`<section><h3>Appearance</h3><p>Soft light, calm dark, or follow your device.</p><div class="seg">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button data-x="theme" data-v="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div></section>
  <section><h3>Daily rituals</h3><p>Small things to tick off each day in Review.</p><div>${rituals().map(r=>`<div class="ritrow"><span>${esc(r.label)}</span><button class="iconbtn" data-x="rdel" data-v="${r.id}" aria-label="Remove ${esc(r.label)}">${icon("x")}</button></div>`).join("")||""}</div>
    <form class="add ritform"><input placeholder="e.g. Fajr, morning walk, read 10 pages" aria-label="New ritual"><button aria-label="Add ritual">${icon("plus")}</button></form></section>
  <section><h3>Sync across devices</h3>${on?`<p><span class="${Sync.state==="err"?"bad":"ok"}">●</span> ${Sync.state==="err"?esc(Sync.msg):`Connected to your private gist${ago!=null?` · synced ${ago<1?"just now":ago+" min ago"}`:""}`}</p><div class="row"><button class="btn ghost" data-x="syncnow">Sync now</button><button class="btn ghost" data-x="disconnect">Disconnect</button></div>`
    :`<p>Use the same compass on your phone and laptop. On GitHub, create a token with only the <b>gist</b> permission (Settings → Developer settings → Personal access tokens), then paste it here on each device.</p><div class="row"><input class="tok" type="password" placeholder="GitHub token" autocomplete="off"><button class="btn" data-x="connect">Connect</button></div>`}</section>
  <section><h3>Your data</h3><p>Everything is saved on this device${on?" and in your private gist":""}. Keep a copy whenever you like.</p><div class="row"><button class="btn ghost" data-x="export">Export</button><label class="btn ghost">Import<input type="file" accept=".json,application/json" hidden></label></div></section>`;
}

/* ======== events ======== */
function setTab(t){if(!TABS.some(x=>x[0]===t))t="plan";UI.tab=t;lsSet(UKEY,t);history.replaceState(null,"","#"+t);render();scrollTo(0,0)}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb&&tb.closest("#tabs")){setTab(tb.dataset.tab);return}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,st=UI[b.dataset.tabOf];
  switch(act){
    case"settings":openSettings();break;
    case"gotoday":UI.plan={scope:"day",at:new Date()};setTab("plan");break;
    case"scope":st.scope=b.dataset.v;render();break;
    case"step":st.at=shift(st.scope,st.at,+b.dataset.v);render();break;
    case"now":st.at=new Date();render();break;
    case"openday":UI.plan={scope:"day",at:parse(b.dataset.k)};render();break;
    case"showdone":UI.showDone=!UI.showDone;render();break;
    case"tick":{const row=b.closest(".task"),t=S.tasks[row.dataset.id];if(!t)break;t.done=!t.done;t.doneAt=t.done?Date.now():0;touch("tasks",t.id);
      if(t.done){row.classList.add("ticking");setTimeout(render,420);const td=Object.values(S.tasks).filter(x=>x.when===todayK());if(t.when===todayK()&&td.every(x=>x.done))toast("Everything for today is done. Well done 🌿")}else render();renderHeader();break}
    case"more":taskSheet(b.closest(".task").dataset.id);break;
    case"mood":{const L=logOf(period(UI.review.scope,UI.review.at).key),v=+b.dataset.v;L.mood=L.mood===v?0:v;touch("logs",L.key);render();break}
    case"rit":{const L=logOf(period("day",UI.review.at).key);L.r=L.r||{};L.r[b.dataset.v]=!L.r[b.dataset.v];touch("logs",L.key);b.setAttribute("aria-pressed",!!L.r[b.dataset.v]);break}
    case"rgo":{const k=b.dataset.k;UI.review=k.length===7?{scope:"month",at:parse(k)}:{scope:"day",at:parse(k)};render();break}
    case"present-growth":present(growth().root);break;
    case"qkind":UI.kind=b.dataset.v;$$("[data-act=qkind]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===UI.kind));break;
    case"qsave":saveQuick();break;
    case"filter":UI.filter=b.dataset.v;paintReflectList();break;
    case"newpage":openNote(newNote(UI.kind,""),true);break;
    case"newmap":openMap(newMap(node("")),true);break;
    case"opennote":openNote(b.dataset.id);break;
  }
});
function saveQuick(){const q=$("#qw");if(!q||!q.value.trim())return;newNote(UI.kind,q.value.trim());UI.draft="";q.value="";grow(q);paintReflectList();toast("Saved to "+(UI.kind==="journal"?"your journal":UI.kind==="idea"?"ideas":"notes"))}
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form!=="task")return;e.preventDefault();const inp=$("input",f),v=inp.value.trim();if(!v)return;addTask(v);render();const n=$("#addtask");n&&n.focus()});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.log){const L=logOf(period(UI.review.scope,UI.review.at).key);L[el.dataset.log]=el.value;touch("logs",L.key);grow(el)}
  else if(el.id==="qw"){UI.draft=el.value;grow(el)}
  else if(el.id==="rq"){UI.q=el.value;paintReflectList()}});
document.addEventListener("keydown",e=>{const el=e.target;
  if(el.classList&&el.classList.contains("ttext")){if(e.key==="Enter"){e.preventDefault();el.blur()}else if(e.key==="Escape"){const t=S.tasks[el.closest(".task").dataset.id];el.textContent=t?t.text:"";el.blur()}return}
  if(el.id==="qw"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveQuick();return}
  if(e.key==="Escape"&&layers.length&&!e.defaultPrevented){e.preventDefault();layers[layers.length-1]()}});
document.addEventListener("focusout",e=>{const el=e.target;if(!el.classList||!el.classList.contains("ttext"))return;const row=el.closest(".task"),t=row&&S.tasks[row.dataset.id];if(!t)return;
  const v=el.textContent.replace(/\s+/g," ").trim();
  if(!v){const copy=Object.assign({},t);drop("tasks",t.id);toast("Task deleted",()=>{restore("tasks",copy);render()});setTimeout(softRender)}
  else if(v!==t.text){t.text=v;touch("tasks",t.id)}
  if(pendingRender)setTimeout(softRender)});
document.addEventListener("paste",e=>{if(!e.target.classList||!e.target.classList.contains("ttext"))return;e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text").replace(/\s+/g," "))});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){flush();return}
  if(UI.day!==todayK()){const was=UI.day;UI.day=todayK();["plan","review"].forEach(k=>{if(ymd(UI[k].at)===was)UI[k].at=new Date()});softRender()}
  Sync.run()});
addEventListener("pagehide",flush);
addEventListener("hashchange",()=>{const t=location.hash.slice(1).split("/")[0];if(t&&t!==UI.tab)setTab(t)});

/* ======== boot ======== */
(function boot(){
  applyTheme();
  const raw=lsGet(LKEY);
  if(raw){try{applyData(JSON.parse(raw))}catch(e){}}
  else{const old=lsGet(OLDKEY);if(old){try{migrate(JSON.parse(old))}catch(e){console.warn("Could not bring over earlier data",e)}}
    const os=lsGet(OLDSKEY);if(os&&!Sync.cfg()){try{const c=JSON.parse(os);if(c&&c.token&&c.gist)Sync.setCfg({token:c.token,gist:c.gist})}catch(e){}}}
  if(!S.meta.growth)S.meta.growth=seedGrowth();
  if(!S.meta.rituals)S.meta.rituals={id:"rituals",list:[],_t:0};
  persistQuiet();
  const h=location.hash.slice(1).split("/")[0];UI.tab=TABS.some(x=>x[0]===h)?h:(lsGet(UKEY)||"plan");
  if(location.hash.startsWith("#review/"))UI.review.scope="day";
  render();
  Sync.run();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
})();
</script>
</body>

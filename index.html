<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Compass</title>
<meta name="description" content="Plan, review, grow and archive your life — on any device.">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a personal almanac. Four sections (Plan · Review · Growth · Archive), each with a sub-switch; a floating + captures anything from anywhere. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --sunk:#E6ECE9; --ink:#16201E; --muted:#5A6964; --line:#D7DFDB;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --gold:#A0731A; --warn:#B4472F;
  --spirit:#1D6B58; --health:#BC453B; --inner:#2C7D8C; --close:#B0552B; --service:#7A3E9D; --network:#4F55C4; --edu:#2D5BA6; --creative:#AD3874; --career:#8A5A00; --money:#4E7A27; --audience:#AD3874;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --sunk:#1E2926; --ink:#E4ECE9; --muted:#93A49F; --line:#29362F;
  --accent:#5BC2A4; --accent-ink:#06231B; --gold:#E2B65C; --warn:#F0876F;
  --spirit:#5BC2A4; --health:#F08075; --inner:#6CC7D6; --close:#F09C6E; --service:#C38FE5; --network:#A3A7F5; --edu:#80A7F0; --creative:#EE86BD; --career:#E3AA40; --money:#9DCB6B; --audience:#EE86BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1E2926; --ink:#E4ECE9; --muted:#93A49F; --line:#29362F;
  --accent:#5BC2A4; --accent-ink:#06231B; --gold:#E2B65C; --warn:#F0876F;
  --spirit:#5BC2A4; --health:#F08075; --inner:#6CC7D6; --close:#F09C6E; --service:#C38FE5; --network:#A3A7F5; --edu:#80A7F0; --creative:#EE86BD; --career:#E3AA40; --money:#9DCB6B; --audience:#EE86BD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:110px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.01em;margin:0;line-height:1.1}
.dates{color:var(--muted);font-size:13px;text-align:right}
.dates b{color:var(--ink);font-weight:600}
nav.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px 8px;margin-top:6px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
nav .r{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav .r::-webkit-scrollbar{display:none}
nav button{font:600 14px var(--f-body);border:0;background:none;color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav .gear{font-size:16px;padding:6px 9px;flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0}
p{margin:0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flat{background:var(--bg)}
.phase{display:flex;align-items:baseline;gap:8px}
.phase .label{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.between{justify-content:space-between}
.grow{flex:1 1 180px}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.sm{padding:4px 9px;font-size:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
textarea,input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select{font:400 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{font-family:var(--f-mono)}
textarea{resize:vertical;min-height:44px;line-height:1.5}
.read{font-family:var(--f-read)!important;font-size:16px!important}
.w-auto{width:auto!important}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font:600 13px var(--f-body);color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--muted));display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip span.n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] span.n{color:var(--bg)}
.empty{color:var(--muted);font-size:14px}
.banner{font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ ";color:var(--muted)}
details.more[open]>summary::before{content:"– "}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px 2px 6px;color:var(--ink);font:500 12px var(--f-body);cursor:pointer}
.crumbs button .s{font-size:14px;line-height:1}
.crumbs .sep{color:var(--muted);font-size:12px}
.phead{display:flex;gap:14px;align-items:flex-start}
.phead .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.phrase{font-family:var(--f-read)!important;font-size:19px!important;line-height:1.4;border:0!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important;background:none!important;padding:4px 0!important;width:100%;color:var(--ink)}
.phrase::placeholder{color:var(--muted);font-style:italic}
details.sym{position:relative;flex:none}
details.sym>summary{width:60px;height:60px;border-radius:16px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:32px;line-height:1;background:var(--surface)}
details.sym.sm>summary{width:36px;height:36px;border-radius:10px;font-size:19px}
details.sym>summary.e{font-size:12px;color:var(--muted);font-weight:500;text-align:center;line-height:1.15}
details.sym.sm>summary.e{font-size:16px}
details.sym[open]>summary{border-style:solid;border-color:var(--accent)}
.sympop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(300px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgb(0 0 0 / .18);display:flex;flex-direction:column;gap:8px}
.sympop .g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.sympop .g button{font-size:20px;border:0;background:none;border-radius:6px;padding:4px 0;cursor:pointer;line-height:1.2}
.sympop .g button:hover{background:var(--sunk)}
.compass{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.compass .v{font-family:var(--f-read);font-size:15px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rule{font-family:var(--f-read);font-style:italic;font-size:14px;color:var(--muted)}
.ess{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ess i{width:9px;height:9px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:inline-block}
.ess i.on{background:var(--accent);border-color:var(--accent)}
.return{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.return ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.duenow{font-size:13px;color:var(--warn);font-weight:600}
.prayers{display:flex;gap:6px;flex-wrap:wrap}
.pr{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;font:600 11px var(--f-body);color:var(--muted);padding:0;width:52px}
.pr span.o{width:40px;height:40px;border-radius:50%;border:2px solid var(--spirit);display:grid;place-items:center;font-size:16px;color:var(--spirit);background:var(--bg)}
.pr[aria-pressed="true"] span.o{background:var(--spirit);color:var(--surface)}
.sphere{display:flex;flex-direction:column;gap:6px}
.habits{display:flex;flex-wrap:wrap;gap:6px}
.hb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:500 14px var(--f-body);background:var(--bg);color:var(--ink);cursor:pointer}
.hb .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--c);display:grid;place-items:center;flex:none}
.hb[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.hb[aria-pressed="true"] .box{background:var(--c)}
.hb[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.hb .wk,.hb .tm{font:400 11px var(--f-mono);color:var(--muted)}
.late{border-color:var(--warn)!important}
.num{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:3px 6px 3px 10px;background:var(--bg);font-size:14px}
.num input{width:64px;padding:4px 6px;font-size:14px}
.scale{display:flex;gap:3px;flex-wrap:wrap}
.scale button{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font:500 13px var(--f-mono);color:var(--muted);cursor:pointer;padding:0}
.scale button.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.scale button.in{background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--bg));color:var(--ink)}
.scale.sm button{width:24px;height:24px;font-size:11px;border-radius:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item .txt small{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:12px;margin-top:2px}
.item.done .txt > span{text-decoration:line-through;color:var(--muted)}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c,var(--muted));background:none;cursor:pointer;flex:none;margin-top:2px;padding:0}
.item.done .tick{background:var(--c,var(--accent))}
.carried{color:var(--gold)!important}
.prio{color:var(--gold)}
.idea{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.editor{background:var(--bg);border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
.tog{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cell{border:1px solid var(--line);border-radius:9px;background:var(--bg);min-height:60px;padding:5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);position:relative;min-width:0}
.cell .d{font:500 11px var(--f-mono);color:var(--muted)}
.cell .s{font-size:19px;line-height:1.1}
.cell .sc{position:absolute;right:5px;top:4px;font:500 10px var(--f-mono);color:var(--muted)}
.cell .ev{position:absolute;left:5px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.today{border-color:var(--ink)}
.cell.out{visibility:hidden}
.cell.future{opacity:.6}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekgrid .cell{min-height:112px}
.weekgrid .cell .ph{font-family:var(--f-read);font-size:12px;line-height:1.3;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-width:0;border-left:4px solid var(--c,var(--line))}
.card .s{font-size:22px;line-height:1.1;min-height:24px}
.card .t{font-weight:600}
.card .m{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.card .ph{font-family:var(--f-read);font-size:13px;color:var(--muted);line-height:1.35}
@media (max-width:560px){.weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.weekgrid .cell{min-height:86px}.cell{min-height:50px}.cell .s{font-size:16px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font:500 21px var(--f-mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.rarea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line)}
.rarea:first-of-type{border-top:0}
.rarea .nm{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.rarea .avg{font:500 16px var(--f-mono);text-align:right}
.bars{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px}
.bar{display:flex;flex-direction:column;gap:3px;font-size:12px}
.bar .t{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.bar .t span:last-child{font-family:var(--f-mono);color:var(--ink)}
.track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.fill{height:100%;background:var(--c,var(--accent))}
.harvest{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.harvest div{font-size:14px;display:flex;gap:10px}
.harvest time{font:400 12px var(--f-mono);color:var(--muted);flex:none;width:58px;padding-top:2px}
.harvest .q{font-family:var(--f-read)}
.notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.note{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);border-left:4px solid var(--c,var(--line));min-width:0}
.note .h{display:flex;gap:8px;align-items:center;font-weight:600}
.note .b{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.note .m{font:400 11px var(--f-mono);color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:2px;width:max-content}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--sunk);display:block}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.tedit{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.dayspick{display:flex;gap:3px;flex-wrap:wrap}
.dayspick button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font:600 11px var(--f-body);color:var(--muted);cursor:pointer;padding:0}
.dayspick button[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.vcard{border-left:4px solid var(--c);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.lifecanvas{width:100%;display:block}
.person{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);font:700 15px var(--f-display)}
.due{color:var(--gold);font-weight:600}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.ledger{grid-template-columns:1fr}}
.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ms{position:relative;padding:8px 0}
.ms::before{content:"";position:absolute;left:-20px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--muted))}
.ms.past::before{background:var(--c,var(--muted))}
.ms .when{font:500 12px var(--f-mono);color:var(--muted)}
.ms .t{font-weight:600}
.ms .l{font-family:var(--f-read);font-size:14px;color:var(--muted)}
.nowmark{position:relative;padding:6px 0;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.nowmark::before{content:"";position:absolute;left:-22px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--gold)}

(function(){

const NK={all:"All",daily:"Daily journal",note:"Notes",idea:"Ideas",journal:"Journal",learning:"Learn → share",quote:"Quotes & ayat"};

const STATUS={active:"Active",incubating:"Someday",recreational:"Just for joy",done:"Done"};

const S={mode:"local",plan:null,lists:null,tpl:null,growth:null,days:{},reviews:{},tasks:{},notes:{},people:{},projects:{},events:{},
  view:"plan",sub:{plan:"today",review:"day",growth:"picture",archive:"overview",circles:"close",system:"areas"},date:new Date(),loaded:false,doneQ:"",deleted:{},
  libCat:"all",libStatus:"all",taskFilter:"today",noteKind:"all",noteQ:"",open:{},trk:null,openArea:null,projView:"list",cap:null};
let db=null;
/* ======== helpers ======== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>ymd(new Date());
const cvar=id=>`var(--${AREA_IDS.includes(id)||id==="audience"?id:"muted"})`;
const sh=(d,o)=>d.toLocaleDateString("en-GB",o);
const fmtD=s=>s?sh(parse(s),{day:"numeric",month:"short"}):"";
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
function hijri(d){try{return new Intl.DateTimeFormat("en-GB-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(d)}catch(e){return""}}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))}
const wdIdx=d=>(d.getDay()+6)%7;
function range(kind,a){
  let start,end,label,key,sub="";
  if(kind==="day"){start=new Date(a.getFullYear(),a.getMonth(),a.getDate());end=start;key=ymd(a);label=sh(a,{weekday:"long",day:"numeric",month:"long"})}
  else if(kind==="week"){start=monday(a);end=addDays(start,6);const w=isoWeek(a);key=w.y+"-W"+pad(w.w);label="Week "+w.w;sub=sh(start,{day:"numeric",month:"short"})+" – "+sh(end,{day:"numeric",month:"short",year:"numeric"})}
  else if(kind==="month"){start=new Date(a.getFullYear(),a.getMonth(),1);end=new Date(a.getFullYear(),a.getMonth()+1,0);key=a.getFullYear()+"-"+pad(a.getMonth()+1);label=sh(start,{month:"long"});sub=String(a.getFullYear())}
  else if(kind==="season"){const q=Math.floor(a.getMonth()/3);start=new Date(a.getFullYear(),q*3,1);end=new Date(a.getFullYear(),q*3+3,0);key=a.getFullYear()+"-Q"+(q+1);label=SEASONS[q]+" season";sub="Q"+(q+1)+" "+a.getFullYear()+" · "+sh(start,{month:"short"})+"–"+sh(end,{month:"short"})}
  else{start=new Date(a.getFullYear(),0,1);end=new Date(a.getFullYear(),11,31);key=String(a.getFullYear());label=String(a.getFullYear());sub="The year"}
  return{kind,start,end,label,key,sub,s:ymd(start),e:ymd(end)};
}
function shift(kind,a,n){const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());if(kind==="day")x.setDate(x.getDate()+n);else if(kind==="week")x.setDate(x.getDate()+7*n);else if(kind==="month")x.setMonth(x.getMonth()+n,1);else if(kind==="season")x.setMonth(x.getMonth()+3*n,1);else x.setFullYear(x.getFullYear()+n,0,1);return x}
const keysIn=r=>{const out=[];for(let x=new Date(r.start);x<=r.end;x=addDays(x,1))out.push(ymd(x));return out};
function whenKey(w){const m=String(w||"").match(/(\d{4})(?:-(\d{1,2}))?/);return m?m[1]+"-"+pad(m[2]||0):""}
function whenLabel(w){const m=String(w||"").match(/(\d{4})(?:-(\d{1,2}))?/);if(!m)return w||"";return m[2]?sh(new Date(+m[1],+m[2]-1,1),{month:"short",year:"numeric"}):m[1]}

/* ======== storage ======== */
/* Local-first: everything is saved in this browser right away. Optional sync keeps a private
   GitHub Gist as the shared copy, so the same data opens on phone, laptop or any other device.
   Every record carries _t (last edit time) and deletions leave a dated marker, so two devices
   that edited different things merge cleanly; the same record edited on both keeps the newer edit. */
const DOCS={plan:"life/plan",lists:"life/lists",tpl:"life/templates",growth:"life/growth"};
const COLS=["days","reviews","tasks","notes","people","projects","events"];
const LKEY="lifecompass3",SKEY="lifecompass-sync",TKEY="lifecompass-theme",GIST_FILE="lifecompass.json";
const timers={},chains={};
function setStatus(t){$("#status").textContent=t}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function localGet(){try{const r=lsGet(LKEY);return r?JSON.parse(r):null}catch(e){return null}}
function snapshot(){const o={app:"lifecompass",v:2,savedAt:S.savedAt||0,deleted:S.deleted||{}};Object.keys(DOCS).forEach(k=>o[k]=S[k]);COLS.forEach(k=>o[k]=S[k]);return o}
function applyData(l){Object.keys(DOCS).forEach(k=>S[k]=l[k]||null);COLS.forEach(k=>S[k]=l[k]||{});S.deleted=l.deleted||{};S.savedAt=l.savedAt||0}
function localPut(){try{S.savedAt=Date.now();localStorage.setItem(LKEY,JSON.stringify(snapshot()))}catch(e){setStatus(failMsg(e))}}
function failMsg(e){return e&&(e.code==="quota_exceeded"||e.name==="QuotaExceededError")?"Storage is full — delete old items to keep saving":"Couldn't save just now — it will retry on your next edit"}
function save(path,getData,delay){
  clearTimeout(timers[path]);setStatus("Saving…");
  timers[path]=setTimeout(()=>{delete timers[path];
    if(!db){localPut();Sync.soon();setStatus(Sync.on()?"Saved · syncing…":"Saved on this device");return}
    const data=getData();if(!data)return;const body=JSON.parse(JSON.stringify(data));
    chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>setStatus("Saved ✓")).catch(e=>setStatus(failMsg(e)));
  },delay==null?450:delay);
}
function remove(path){clearTimeout(timers[path]);delete timers[path];S.deleted[path]=Date.now();if(!db){localPut();Sync.soon();return}chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(path).delete()).then(()=>setStatus("Deleted")).catch(e=>setStatus(failMsg(e)))}
function flushLocal(){const ks=Object.keys(timers);if(db||!ks.length)return;ks.forEach(p=>{clearTimeout(timers[p]);delete timers[p]});localPut()}
const saveDoc=k=>{if(S[k])S[k]._t=Date.now();save(DOCS[k],()=>S[k],k==="lists"?200:400)};
const savePlan=()=>saveDoc("plan"),saveLists=()=>saveDoc("lists"),saveTpl=()=>saveDoc("tpl"),saveGrowth=()=>saveDoc("growth");
const saveC=(col,id)=>{const o=S[col][id];if(o)o._t=Date.now();save(col+"/"+id,()=>S[col][id],col==="notes"?600:300)};
const saveDay=k=>saveC("days",k),saveRev=k=>saveC("reviews",k);
const hasData=()=>COLS.some(c=>Object.keys(S[c]||{}).length);
/* merge another copy into S; reports whether S changed and whether S holds edits the other copy lacks */
function mergeIn(r){
  let changed=false,ahead=false;const del=S.deleted=S.deleted||{},rdel=r.deleted||{};const t=o=>(o&&o._t)||0;
  Object.entries(rdel).forEach(([p,x])=>{if(!del[p]||del[p]<x)del[p]=x});
  Object.keys(del).forEach(p=>{if(!rdel[p]||rdel[p]<del[p])ahead=true});
  Object.keys(DOCS).forEach(k=>{const b=r[k];if(b&&(!S[k]||t(b)>t(S[k]))){S[k]=b;changed=true}else if(S[k]&&(!b||t(S[k])>t(b)))ahead=true});
  COLS.forEach(col=>{const R=r[col]||{},L=S[col]=S[col]||{};
    Object.keys(R).forEach(id=>{if(!L[id]||t(R[id])>t(L[id])){L[id]=R[id];changed=true}});
    Object.keys(L).forEach(id=>{const d=del[col+"/"+id];if(d&&d>=t(L[id])){delete L[id];changed=true;return}if(!R[id]||t(L[id])>t(R[id]))ahead=true})});
  const cut=Date.now()-365*864e5;Object.keys(del).forEach(p=>{if(del[p]<cut)delete del[p]});
  return{changed,ahead};
}
const Sync={
  t:null,running:false,again:false,state:"",msg:"",
  cfg(){try{return JSON.parse(lsGet(SKEY)||"null")}catch(e){return null}},
  setCfg(c){lsSet(SKEY,c?JSON.stringify(c):null)},
  on(){const c=this.cfg();return !db&&!!(c&&c.token&&c.gist)},
  soon(){if(!this.on())return;clearTimeout(this.t);this.t=setTimeout(()=>{this.t=null;this.run()},2500)},
  async api(path,opt){const c=this.cfg()||{};
    const r=await fetch("https://api.github.com"+path,Object.assign({cache:"no-store"},opt,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}}));
    if(!r.ok){const e=new Error("GitHub said "+r.status);e.status=r.status;throw e}return r.status===204?null:r.json()},
  async pull(){const c=this.cfg();const g=await this.api("/gists/"+c.gist);const f=g.files&&g.files[GIST_FILE];if(!f)return null;
    let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}return txt?JSON.parse(txt):null},
  push(){const c=this.cfg();return this.api("/gists/"+c.gist,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(snapshot())}}})})},
  async run(){
    if(!this.on())return;if(this.running){this.again=true;return}this.running=true;
    try{
      flushLocal();
      const r=await this.pull();const m=r?mergeIn(r):{changed:false,ahead:true};
      if(m.changed){localPut();softRender()}
      if(m.ahead)await this.push();
      const c=this.cfg();if(c){c.last=Date.now();this.setCfg(c)}
      this.state="ok";this.msg="";setStatus("Synced ✓");
    }catch(e){this.state="err";
      this.msg=e.status===401||e.status===403?"GitHub rejected the token — reconnect in Settings → Sync & data":e.status===404?"The sync gist is gone — reconnect in Settings → Sync & data":navigator.onLine===false?"Offline — changes are safe here and will sync when you're back online":"Couldn't sync just now — will retry";
      setStatus(this.msg)}

  },
  async connect(token){
    this.setCfg({token});let gist=null;
    for(let page=1;page<=10&&!gist;page++){const list=await this.api("/gists?per_page=100&page="+page);if(!list||!list.length)break;const g=list.find(x=>x.files&&x.files[GIST_FILE]);if(g)gist=g.id}
    if(gist){this.setCfg({token,gist});return{found:true,remote:await this.pull()}}
    localPut();
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:"Life Compass — my data (private, synced by the app)",public:false,files:{[GIST_FILE]:{content:JSON.stringify(snapshot())}}})});
    this.setCfg({token,gist:g.id,last:Date.now()});return{found:false};
  },
  disconnect(){clearTimeout(this.t);this.setCfg(null);this.state="";this.msg=""}
};
function applyTheme(){const t=lsGet(TKEY);if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function busy(){const a=document.activeElement;return a&&a.closest&&a.closest("#main,#sheet")&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!["checkbox","button"].includes(a.type))||a.tagName==="SELECT")}
let pending=false;
function softRender(){if(busy()||document.querySelector("details.sym[open]")){pending=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending&&!busy()){pending=false;render()}},60));
const clone=o=>JSON.parse(JSON.stringify(o));
async function init(){
  applyTheme();route();render();
  try{db=await claude.use("db")}catch(e){db=null}
  setInterval(()=>{if(S.view==="plan"&&S.sub.plan==="today")softRender()},60000);
  if(!db){S.mode="local";const l=localGet();if(l)applyData(l);S.loaded=true;render();
    Sync.run();setInterval(()=>Sync.run(),5*60000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")Sync.run();else{flushLocal();if(Sync.t){clearTimeout(Sync.t);Sync.t=null;Sync.run()}}});
    window.addEventListener("online",()=>Sync.run());window.addEventListener("pagehide",flushLocal);
    if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
    return}
  S.mode="db";let got=0;const N=Object.keys(DOCS).length+COLS.length;
  const once=f=>{let d=false;return x=>{f(x);if(!d){d=true;if(++got>=N)S.loaded=true}softRender()}};
  Object.entries(DOCS).forEach(([k,p])=>db.doc(p).onSnapshot(once(s=>{if(!timers[p])S[k]=s.exists?clone(s.data()):null}),err));
  COLS.forEach(col=>db.collection(col).onSnapshot(once(q=>{q.docChanges().forEach(c=>{const p=col+"/"+c.doc.id;if(timers[p])return;if(c.type==="removed")delete S[col][c.doc.id];else S[col][c.doc.id]=clone(c.doc.data())})}),err));
}

  const now=new Date(),hm=pad(now.getHours())+":"+pad(now.getMinutes());
  const prayerH=PRAYERS.map(([id,n])=>({id,n,h:(findHabit(id)||{}).h})).filter(x=>x.h);
  const prayed=prayerH.filter(x=>v[x.id]===true).length;
  const ess=[["Energy",!!d.energy],["Prayers",prayerH.length?prayed===prayerH.length:true],["One step",!!(d.step||"").trim()],["Lesson",!!(d.lesson||"").trim()]];
  const pendingH=x=>!isDone(x.h,v[x.h.id])&&!(x.h.type!=="num"&&x.h.target&&x.h.target<7&&weekCount(x.h.id,date)>=x.h.target);

}

function habitSummary(h,days){
  const n=Math.max(1,days.length);
  if(h.type==="num"){const vs=days.map(k=>S.days[k]&&S.days[k].v&&Number(S.days[k].v[h.id])).filter(v=>v>0);
    if(h.agg==="avg"){const av=vs.length?vs.reduce((s,v)=>s+v,0)/vs.length:0;return{h,txt:vs.length?av.toFixed(1)+(h.unit?" "+h.unit:"")+" avg":"—",pct:h.target?Math.min(1,av/h.target):(vs.length?1:0)}}
    const sum=vs.reduce((s,v)=>s+v,0);const goal=(h.target||0)*n/7;return{h,txt:(Math.round(sum*10)/10)+(goal?" / "+Math.round(goal):"")+(h.unit?" "+h.unit:""),pct:goal?Math.min(1,sum/goal):(sum?1:0)}}
  const weekly=h.target&&h.target<7;const c=days.filter(k=>S.days[k]&&S.days[k].v&&S.days[k].v[h.id]===true).length;
  const goal=weekly?Math.max(1,Math.round(h.target*n/7)):Math.max(1,days.filter(k=>scheduled(h,parse(k))).length);
  return{h,txt:c+" / "+goal,pct:Math.min(1,c/goal)};
}
function areaRatings(r){
  // weekly ratings live on week reviews; longer periods average the weeks that start inside them
  const wks=[];for(let w=monday(r.start);w<=r.end;w=addDays(w,7)){if(r.kind!=="week"&&w<r.start)continue;wks.push(range("week",w).key)}
  const out={};areas().forEach(a=>{const vals=wks.map(k=>(S.reviews[k]&&S.reviews[k].areas||{})[a.id]).filter(v=>typeof v==="number");out[a.id]={avg:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null,series:wks.map(k=>(S.reviews[k]&&S.reviews[k].areas||{})[a.id]??null)}});
  return out;
}
function spark(sc,c){const W=110,H=26;if(sc.length<2)return"";const step=W/(sc.length-1);let p="",pen=false;sc.forEach((v,i)=>{if(v==null){pen=false;return}p+=(pen?"L":"M")+(i*step).toFixed(1)+" "+(H-2-(v-1)/9*(H-4)).toFixed(1);pen=true});return p?`<svg viewBox="-2 0 ${W+4} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${p}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`:""}
function trend(days){

  const vals=pts.map(p=>{const a=p.ks.map(dayScore).filter(v=>v!=null);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null});
  if(!vals.some(v=>v!=null))return `<p class="empty">No day ratings yet. Rate each evening in Review → Day and the line appears here.</p>`;
  const W=640,H=160,L=30,R=10,T=10,Bm=24,iw=W-L-R,ih=H-T-Bm;const X=i=>L+(pts.length>1?i*iw/(pts.length-1):iw/2),Y=v=>T+ih-(v/10)*ih;
  let g="";[0,5,10].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
  let p="",pen=false,dots="";vals.forEach((v,i)=>{if(v==null){pen=false;return}p+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${pts.length>40?1.6:3}" fill="var(--accent)"><title>${sh(pts[i].lab,{day:"numeric",month:"short"})}: ${v.toFixed(1)}</title></circle>`});

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Day ratings ${byWeek?"by week":"by day"}">${g}<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${dots}${xl}</svg></div>`;
}

function gantt(P){
  const withDates=P.filter(p=>p.start||p.end);if(!withDates.length)return `<section class="panel"><p class="empty">Give projects a start or end date to see them on the timeline.</p></section>`;
  const t=new Date();let lo=new Date(t.getFullYear(),t.getMonth()-1,1),hi=new Date(t.getFullYear(),t.getMonth()+6,1);
  withDates.forEach(p=>{const s=parse(p.start||p.end),e=parse(p.end||p.start);if(s<lo)lo=new Date(s.getFullYear(),s.getMonth(),1);if(e>hi)hi=new Date(e.getFullYear(),e.getMonth()+1,1)});
  const months=[];for(let m=new Date(lo);m<hi&&months.length<36;m=new Date(m.getFullYear(),m.getMonth()+1,1))months.push(m);
  const end=new Date(months[months.length-1].getFullYear(),months[months.length-1].getMonth()+1,1);
  const W=760,L=170,R=10,rowH=30,T=26,H=T+withDates.length*rowH+10;const span=end-lo;const X=d=>L+(W-L-R)*((d-lo)/span);
  let g=months.map((m,i)=>`<line x1="${X(m)}" x2="${X(m)}" y1="${T-6}" y2="${H}" stroke="var(--line)"/>${(months.length<=14||i%2===0)?`<text x="${X(m)+3}" y="${T-10}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(sh(m,{month:"short"}))}${m.getMonth()===0?" "+m.getFullYear():""}</text>`:""}`).join("");
  withDates.sort((a,b)=>(a.start||a.end).localeCompare(b.start||b.end)).forEach((p,i)=>{const y=T+i*rowH;const s=parse(p.start||p.end),e=addDays(parse(p.end||p.start),1);const pr=projProgress(p);const x1=X(s),x2=Math.max(X(e),x1+6);
    g+=`<text x="4" y="${y+19}" font-size="12" fill="var(--ink)" font-family="Hanken Grotesk,sans-serif">${esc(((p.symbol||"")+" "+(p.name||"")).slice(0,24))}</text><rect x="${x1}" y="${y+6}" width="${x2-x1}" height="18" rx="5" fill="${cvar(p.area)}" opacity="${p.status==="done"?.45:.85}" data-act="openproj" data-v="${p.id}" style="cursor:pointer"><title>${esc(p.name)}: ${esc(p.start||"?")} → ${esc(p.end||"?")}</title></rect>${pr.n?`<rect x="${x1}" y="${y+21}" width="${(x2-x1)*pr.d/pr.n}" height="3" fill="var(--ink)" opacity=".5"/>`:""}`});
  g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T-6}" y2="${H}" stroke="var(--gold)" stroke-width="2"/><text x="${X(t)+3}" y="${H-2}" font-size="10" fill="var(--gold)" font-family="IBM Plex Mono,monospace">today</text>`;
  return `<section class="panel"><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Project timeline">${g}</svg></div></section>`;
}

function drawLife(){

  const span=80;const W=cv.clientWidth||600;const lab=24;const cell=Math.max(4,Math.floor((W-lab)/52));const gap=cell>6?1:.5;const H=span*cell+2;
  const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";const c=cv.getContext("2d");c.scale(dpr,dpr);
  const b=parse(S.plan.birth);const wk=d=>Math.floor((d-b)/(7*864e5));const lived=wk(new Date());
  const lw=new Set(Object.keys(S.days).filter(k=>logged(S.days[k])).map(k=>wk(parse(k))));

  for(let y=0;y<span;y++){if(y%10===0){c.globalAlpha=1;c.fillStyle=col("--muted");c.font="10px 'IBM Plex Mono', monospace";c.fillText(String(y),0,y*cell+cell-1)}
    for(let w=0;w<52;w++){const i=y*52+w;let f=col("--sunk"),a=1;if(i===lived)f=col("--gold");else if(ms.has(i))f=col("--gold");else if(lw.has(i))f=col("--accent");else if(i<lived){f=col("--muted");a=.35}c.globalAlpha=a;c.fillStyle=f;
      if(ms.has(i)&&i!==lived){c.beginPath();const cx=lab+w*cell+(cell-gap)/2,cy=y*cell+(cell-gap)/2,r=(cell-gap)/2+.5;c.moveTo(cx,cy-r);c.lineTo(cx+r,cy);c.lineTo(cx,cy+r);c.lineTo(cx-r,cy);c.fill()}else c.fillRect(lab+w*cell,y*cell,cell-gap,cell-gap)}}
  c.globalAlpha=1;

function streaks(h){
  const t=new Date();
  if(h.type!=="num"&&h.target&&h.target<7){const wks=[];for(let i=0;i<104;i++){const m=addDays(monday(t),-7*i);let c=0;for(let j=0;j<7;j++){const x=S.days[ymd(addDays(m,j))];if(x&&x.v&&x.v[h.id]===true)c++}wks.push(c>=h.target)}
    let cur=0,i=wks[0]?0:1;for(;i<wks.length&&wks[i];i++)cur++;let best=0,run=0;wks.forEach(w=>{run=w?run+1:0;best=Math.max(best,run)});return{cur,best,unit:"weeks"}}
  const ok=k=>{const d=S.days[k];return d&&d.v&&isDone(h,d.v[h.id])};const keys=[];for(let i=0;i<730;i++)keys.push(ymd(addDays(t,-i)));
  let cur=0,i=ok(keys[0])?0:1;for(;i<keys.length;i++){if(!scheduled(h,parse(keys[i])))continue;if(ok(keys[i]))cur++;else break}
  let best=0,run=0;for(let j=keys.length-1;j>=0;j--){if(!scheduled(h,parse(keys[j])))continue;if(ok(keys[j])){run++;best=Math.max(best,run)}else run=0}
  return{cur,best,unit:"days"};
}
function vStats(){

  const s30=habitSummary(h,last(30)),s90=habitSummary(h,last(90)),s365=habitSummary(h,last(365));const st=streaks(h);
  const vals=Object.keys(S.days).map(k=>S.days[k].v&&S.days[k].v[h.id]).filter(v=>v!=null&&v!==false);const total=h.type==="num"?vals.reduce((s,v)=>s+Number(v||0),0):vals.length;
  const start=addDays(monday(t),-52*7);let cells="";const maxN=h.type==="num"?Math.max(1,...vals.map(Number)):1;
  for(let i=0;i<53*7;i++){const d=addDays(start,i);const k=ymd(d);const v=S.days[k]&&S.days[k].v&&S.days[k].v[h.id];let q=0;if(d>t)q=-1;else if(h.type==="num")q=Number(v)>0?Math.max(.25,Number(v)/maxN):0;else q=v===true?1:0;
    cells+=`<i title="${esc(sh(d,{day:"numeric",month:"short",year:"numeric"}))}${v!=null&&v!==false?": "+esc(v===true?"done":v):""}" style="${q<0?"opacity:.3":q>0?`background:color-mix(in srgb,var(--c) ${Math.round(q*100)}%,var(--sunk))`:""}"></i>`}
  const wk=[];for(let i=11;i>=0;i--){const m=addDays(monday(t),-7*i);const ks=Array.from({length:7},(_,j)=>ymd(addDays(m,j)));let v=0;if(h.type==="num"){const xs=ks.map(k=>Number(S.days[k]&&S.days[k].v&&S.days[k].v[h.id])||0).filter(x=>x>0);v=h.agg==="avg"?(xs.length?xs.reduce((s,x)=>s+x,0)/xs.length:0):xs.reduce((s,x)=>s+x,0)}else v=ks.filter(k=>S.days[k]&&S.days[k].v&&S.days[k].v[h.id]===true).length;wk.push({m,v})}
  const tgt=h.type==="num"?h.target:(h.target||7);const mx=Math.max(1,tgt||0,...wk.map(x=>x.v));
  const W=600,H=150,L=34,Bm=22,T=10,bw=(W-L-10)/12;const Y=v=>T+(H-T-Bm)*(1-v/mx);const lbl=v=>String(Math.round(v*10)/10);
  let svg=`<line x1="${L}" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(mx)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lbl(mx)}</text><text x="${L-6}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">0</text>`;
  if(tgt)svg+=`<line x1="${L}" x2="${W-10}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--gold)" stroke-dasharray="4 3"/><text x="${W-12}" y="${Y(tgt)-4}" text-anchor="end" font-size="10" fill="var(--gold)" font-family="IBM Plex Mono,monospace">target ${lbl(tgt)}</text>`;
  wk.forEach((x,i)=>{const X=L+i*bw+bw*.18;svg+=`<rect x="${X.toFixed(1)}" y="${Y(x.v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(0,Y(0)-Y(x.v)).toFixed(1)}" rx="3" fill="${cvar(a.id)}"><title>Week ${isoWeek(x.m).w}: ${lbl(x.v)}</title></rect>`;if(i%2===1)svg+=`<text x="${(X+bw*.32).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">W${isoWeek(x.m).w}</text>`});
  const pc=s=>h.type==="num"&&!h.target?esc(s.txt):Math.round(s.pct*100)+"%";
  return `<section class="panel"><div class="chips">${hs.map(x=>`<button class="fchip" style="--c:${cvar(x.a.id)}" data-act="trk" data-v="${x.h.id}" aria-pressed="${x.h.id===h.id}"><span class="dot"></span>${esc((x.h.symbol?x.h.symbol+" ":"")+x.h.label)}</button>`).join("")}</div></section>
  <section class="panel" style="--c:${cvar(a.id)}"><div class="row"><h3>${esc((h.symbol?h.symbol+" ":"")+h.label)}</h3><span class="chip"><span class="dot"></span>${esc(a.name)}</span></div>
    <div class="stats"><div class="stat"><div class="v">${st.cur}</div><div class="k">Current streak (${st.unit})</div></div><div class="stat"><div class="v">${st.best}</div><div class="k">Best streak (${st.unit})</div></div><div class="stat"><div class="v">${pc(s30)}</div><div class="k">Last 30 days</div></div><div class="stat"><div class="v">${pc(s90)}</div><div class="k">Last 90 days</div></div><div class="stat"><div class="v">${pc(s365)}</div><div class="k">Last 365 days</div></div><div class="stat"><div class="v">${lbl(total)}</div><div class="k">${h.type==="num"?"All-time total":"Times done"}</div></div></div>
    <h3>Last 12 weeks</h3><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.label)} per week">${svg}</svg></div>
    <h3>The past year</h3><div class="heatwrap"><div class="heat">${cells}</div></div></section>`;

function setSym(key,val){
  const i=key.indexOf(":");const kind=i<0?key:key.slice(0,i),id=i<0?"":key.slice(i+1);
  if(kind==="day"){dayDoc(id).symbol=val;saveDay(id)}
  else if(kind==="rv"){rev(id).symbol=val;saveRev(id)}
  else if(kind==="life"){S.plan.symbol=val;savePlan()}
  else if(["note","person","proj"].includes(kind)){const col={note:"notes",person:"people",proj:"projects"}[kind];const o=S[col][id];if(o){o.symbol=val;o.updated=Date.now();saveC(col,id)}}
  else if(kind==="ms"){const m=(S.plan.milestones||[]).find(x=>x.id===id);if(m){m.symbol=val;savePlan()}}
  else if(kind==="tpl"){const t=((S.tpl||{}).items||[]).find(x=>x.id===id);if(t){t.symbol=val;saveTpl()}}
  else if(kind==="trk"){const x=findHabit(id);if(x){x.h.symbol=val;S.openArea=x.a.id;savePlan()}}
  else if(kind==="area"){const a=areaById(id);if(a){a.symbol=val;savePlan()}}
  else if(kind==="skill"){const s=skillById(id);if(s){s.symbol=val;saveGrowth()}}
  render();
}
function setField(kind,key,field,raw){
  let val=raw;
  if(field.endsWith("[]")){field=field.slice(0,-2);val=raw.split("\n").map(x=>x.trim()).filter(Boolean)}
  else if(field.endsWith("#")){field=field.slice(0,-1);val=raw===""?null:Number(raw)}
  const col={task:"tasks",note:"notes",person:"people",proj:"projects",event:"events"}[kind];
  if(col){const o=S[col][key];if(!o)return;o[field]=val;if(col==="notes")o.updated=Date.now();
    if(col==="people"&&field==="circle"){o.tag=TAGS[val][0];o.cadence=val==="close"?7:val==="service"?14:60;saveC(col,key);render();return}
    saveC(col,key);if(["due","project","area","kind","status","date","circle"].includes(field)&&col!=="notes")render();return}
  if(kind==="day"){dayDoc(key)[field]=val;saveDay(key)}
  else if(kind==="rv"){rev(key)[field]=val;saveRev(key)}
  else if(kind==="plan"){S.plan[field]=val;savePlan();if(field==="birth")render()}
  else if(kind==="anchor"){S.plan.anchor=S.plan.anchor||{};S.plan.anchor[field]=val;savePlan()}
  else if(kind==="energy"){S.plan.energy=S.plan.energy||{};S.plan.energy[key]=val;savePlan()}
  else if(kind==="area"){const a=areaById(key);if(a){a[field]=val;savePlan()}}
  else if(kind==="ms"){const m=(S.plan.milestones||[]).find(x=>x.id===key);if(m){m[field]=val;savePlan()}}
  else if(kind==="tpl"){const t=((S.tpl||{}).items||[]).find(x=>x.id===key);if(t){t[field]=val;saveTpl()}}
  else if(kind==="skill"){const s=skillById(key);if(s){s[field]=val;saveGrowth();if(field==="area")render()}}
  else if(kind==="led"){const l=ledger().find(x=>x.id===key);if(l){l[field]=val;saveGrowth();if(field!=="text")render()}}
  else if(kind==="trk"){const x=findHabit(key);if(!x)return;S.openArea=x.a.id;
    if(field==="kind"){if(val==="check"){x.h.type="check";delete x.h.agg;delete x.h.unit;if(!x.h.target||x.h.target>7)x.h.target=7}else{x.h.type="num";x.h.agg=val;x.h.target=null}savePlan();render();return}
    if(field==="time"&&!val)delete x.h.time;else x.h[field]=val;savePlan()}
}

  evdel:v=>{delete S.events[v];remove("events/"+v);S.open.event=null;render()},
  togevp:v=>{const[eid,pid]=v.split("|");const e=S.events[eid];if(!e)return;e.people=e.people||[];e.people=e.people.includes(pid)?e.people.filter(x=>x!==pid):e.people.concat(pid);saveC("events",eid);render()},
  addgoal:()=>{const v=$("#new-goal").value.trim();if(!v)return;S.lists.goals=S.lists.goals||[];S.lists.goals.unshift({id:uid(),text:v,area:$("#new-goal-area").value,horizon:$("#new-goal-h").value,done:false});saveLists();render()},
  goaldone:v=>{const g=(S.lists.goals||[]).find(x=>x.id===v);if(g){g.done=!g.done;g.doneAt=g.done?today():"";saveLists();render()}},
  goaldel:v=>{S.lists.goals=(S.lists.goals||[]).filter(x=>x.id!==v);saveLists();render()},
  tpladd:()=>{S.tpl=S.tpl||{items:[]};S.tpl.items=S.tpl.items||[];const id=uid();S.tpl.items.unshift({id,name:"",symbol:"",lines:[]});saveTpl();render();focusSoon(bindId("tpl",id,"name"))},
  tpldel:v=>{S.tpl.items=S.tpl.items.filter(t=>t.id!==v);saveTpl();render()},
  usetpl:v=>{const t=((S.tpl||{}).items||[]).find(x=>x.id===v);if(!t)return;const di=document.getElementById("tpld-"+v);const due=di&&di.value?di.value:ymd(S.date);(t.lines||[]).forEach(l=>newTask(l,due));render();setStatus("Added "+(t.lines||[]).length+" tasks for "+fmtD(due))},
  tplnote:v=>{const t=((S.tpl||{}).items||[]).find(x=>x.id===v);if(!t)return;const di=document.getElementById("tpld-"+v);const d=di&&di.value?di.value:ymd(S.date);const id=newNote("note",(t.name||"Checklist")+" · "+fmtD(d),(t.lines||[]).map(l=>"☐ "+l).join("\n"));S.notes[id].symbol=t.symbol||"";S.open.note=id;S.noteKind="all";go("archive","notes")},
  cmode:v=>{const[c,m]=v.split("|");S.plan.circles=S.plan.circles||{};S.plan.circles[c]=Object.assign({},circ(c),{mode:m});savePlan();render()},
  nperson:()=>{const v=$("#nperson").value.trim();if(!v)return;newPerson(v,S.sub.circles,$("#nperson-tag").value);render();focusSoon("nperson")},
  openperson:v=>{S.open.person=v;const p=S.people[v];if(p)S.sub.circles=p.circle;if(S.view!=="growth"||S.sub.growth!=="circles")go("growth","circles");else render();window.scrollTo({top:0,behavior:"smooth"})},
  closeperson:()=>{S.open.person=null;render()},
  persondel:v=>{delete S.people[v];remove("people/"+v);S.open.person=null;render()},
  psupport:v=>{const p=S.people[v];if(p){p.support=!p.support;saveC("people",v);render()}},
  touch:v=>{logTouch(v,{d:ymd(S.date)>today()?today():ymd(S.date)});render()},
  logx:v=>{const[pid,x]=v.split("|");const p=S.people[pid];const l=p&&(p.log||[]).filter(l=>l.d===ymd(S.date)).pop();if(l){l.x=l.x===x?"":x;saveC("people",pid);render()}},
  logf:v=>{const[pid,f]=v.split("|");const p=S.people[pid];const l=p&&(p.log||[]).filter(l=>l.d===ymd(S.date)).pop();if(l){l.f=l.f===f?"":f;saveC("people",pid);render()}},
  plog:v=>{const e={d:$("#plog-d").value||today()};const n=$("#plog-n").value.trim(),x=$("#plog-x").value,f=$("#plog-f").value;if(n)e.n=n;if(x)e.x=x;if(f)e.f=f;logTouch(v,e);render()},
  plogdel:v=>{const[pid,i]=v.split("|");const p=S.people[pid];if(!p)return;p.log.splice(+i,1);p.last=(p.log.map(l=>l.d).sort().pop())||"";saveC("people",pid);render()},
  nskill:()=>{const v=$("#nskill").value.trim();if(!v)return;const g=ensureGrowth();const id=uid();g.skills.push({id,name:v,area:$("#nskill-area").value,level:1,log:[],created:Date.now()});saveGrowth();render();focusSoon("nskill")},
  openskill:v=>{S.open.skill=v;if(S.view!=="growth"||S.sub.growth!=="skills")go("growth","skills");else render();window.scrollTo({top:0,behavior:"smooth"})},
  closeskill:()=>{S.open.skill=null;render()},
  skilllvl:v=>{const[id,n]=v.split("|");const s=skillById(id);if(s){s.level=+n;saveGrowth();render()}},
  sprac:v=>{const i=$("#sprac");const n=i&&i.value.trim();const s=skillById(v);if(!s)return;s.log=s.log||[];s.log.push({d:today(),note:n||"Practised"});saveGrowth();render();focusSoon("sprac")},
  skilldel:v=>{const g=ensureGrowth();g.skills=g.skills.filter(s=>s.id!==v);saveGrowth();S.open.skill=null;render()},
  nled:v=>{const i=$("#nled-"+v);const t=i&&i.value.trim();if(!t)return;ensureGrowth().ledger.push({id:uid(),text:t,kind:v,area:"",status:"noticing",created:Date.now()});saveGrowth();render();focusSoon("nled-"+v)},
  leddel:v=>{const g=ensureGrowth();g.ledger=g.ledger.filter(x=>x.id!==v);saveGrowth();render()},
  ledtrack:v=>{const l=ledger().find(x=>x.id===v);if(!l)return;const a=areaById(l.area)||areaById("inner")||areas()[0];const hid=uid();a.habits=a.habits||[];a.habits.push({id:hid,label:l.text.slice(0,40),type:"check",target:7});l.habitId=hid;if(!l.area)l.area=a.id;l.status=l.status==="noticing"?"working":l.status;savePlan();saveGrowth();render();setStatus("Added to Review → Day under "+a.name)},
  opentrk:v=>{S.trk=v;go("archive","trackers")},
  newnote:v=>{S.open.note=newNote(v);render();focusSoon(bindId("note",S.open.note,"title"))},
  opennote:v=>{S.open.note=v;if(S.view!=="archive"||S.sub.archive!=="notes")go("archive","notes");else render();window.scrollTo({top:0,behavior:"smooth"})},
  noteclose:()=>{S.open.note=null;render()},
  notepin:v=>{const n=S.notes[v];if(n){n.pinned=!n.pinned;saveC("notes",v);render()}},
  noteshared:v=>{const n=S.notes[v];if(n){n.shared=!n.shared;saveC("notes",v);render()}},
  notedel:v=>{delete S.notes[v];remove("notes/"+v);S.open.note=null;render()},
  notek:v=>{S.noteKind=v;render()},
  libcat:v=>{S.libCat=v;S.libStatus="all";render()},
  libst:v=>{S.libStatus=v;render()},
  libdone:v=>{const x=(S.lists.library||[]).find(i=>i.id===v);if(x){if(x.status==="done"){x.status=x.prev||"incubating";delete x.doneAt}else{x.prev=x.status;x.status="done";x.doneAt=today()}saveLists();render()}},
  libdel:v=>{S.lists.library=(S.lists.library||[]).filter(i=>i.id!==v);saveLists();render()},
  libadd:()=>{const v=$("#new-lib").value.trim();if(!v)return;S.lists.library=S.lists.library||[];S.lists.library.unshift({id:uid(),cat:$("#new-lib-cat").value,text:v,status:"incubating"});saveLists();render();focusSoon("new-lib")},
  catadd:()=>{const v=$("#new-cat").value.trim();if(!v)return;S.lists.cats=S.lists.cats||[];const id=uid();S.lists.cats.push({id,name:v});S.libCat=id;saveLists();render()},
  spine:v=>{const[k,id]=v.split("|");if(k==="proj")ACT.openproj(id);else if(k==="event")ACT.openev(id);else if(k==="ms"){S.open.ms=id;go("growth","milestones")}else{S.doneQ="";go("archive","done")}},
  msadd:()=>{S.plan.milestones=S.plan.milestones||[];const id=uid();S.plan.milestones.push({id,title:"",when:String(new Date().getFullYear()+1),area:"",symbol:"",lesson:""});S.open.ms=id;savePlan();render();focusSoon(bindId("ms",id,"title"))},
  openms:v=>{S.open.ms=S.open.ms===v?null:v;render()},
  msdel:v=>{S.plan.milestones=(S.plan.milestones||[]).filter(m=>m.id!==v);savePlan();render()},
  trk:v=>{S.trk=v;render()},
  addhabit:v=>{const a=areaById(v);const inp=$("#nh-"+v);const t=inp&&inp.value.trim();if(!t)return;a.habits=a.habits||[];a.habits.push({id:uid(),label:t,type:"check",target:7});S.openArea=v;savePlan();render()},
  delhabit:v=>{const[aid,hid]=v.split(":");const a=areaById(aid);a.habits=(a.habits||[]).filter(h=>h.id!==hid);S.openArea=aid;savePlan();render()},
  hday:v=>{const[hid,i]=v.split(":");const x=findHabit(hid);if(!x)return;const n=+i;let ds=x.h.days&&x.h.days.length?x.h.days.slice():[0,1,2,3,4,5,6];ds=ds.includes(n)?ds.filter(z=>z!==n):ds.concat(n).sort((p,q)=>p-q);if(!ds.length)ds=[n];x.h.days=ds.length===7?[]:ds;S.openArea=x.a.id;savePlan();render()},
  capopen:()=>{S.cap={type:S.cap&&S.cap.type||"task"};$("#sheet").innerHTML="";renderSheet()},
  capclose:()=>{S.cap=null;renderSheet()},
  captype:v=>{const x=$("#cap-x");const keep=x?x.value:"";S.cap.type=v;$("#sheet").innerHTML="";renderSheet();setTimeout(()=>{const y=$("#cap-x");if(y)y.value=keep},40)},
  capsave:()=>{const v=($("#cap-x")||{}).value;const t=(v||"").trim();if(!t)return;const ty=S.cap.type;
    if(ty==="task")newTask(t,($("#cap-d")||{}).value||"");
    else if(ty==="event")newEvent(t,($("#cap-d")||{}).value,($("#cap-t")||{}).value);
    else if(ty==="idea"||ty==="note"){const id=newNote(ty,ty==="idea"?t:t,"");if(ty==="note"){S.notes[id].title=t}}
    else if(ty==="person")newPerson(t,($("#cap-c")||{}).value||"close");
    else if(ty==="skill"){ensureGrowth().skills.push({id:uid(),name:t,area:($("#cap-a")||{}).value||"",level:1,log:[],created:Date.now()});saveGrowth()}
    else if(ty==="lib"){S.lists.library=S.lists.library||[];S.lists.library.unshift({id:uid(),cat:($("#cap-l")||{}).value,text:t,status:"incubating"});saveLists()}
    setStatus("Captured ✓");$("#cap-x").value="";render();focusSoon("cap-x")},
  starter:()=>{
    S.plan={areas:AREA_IDS.map(id=>({id,name:AREA_NAMES[id],habits:id==="spirit"?PRAYERS.map(([pid,n])=>({id:pid,label:n,type:"check",target:7})):[]})),milestones:[],rules:[]};
    S.lists={goals:[],library:[],cats:[["see","Places to see"],["learn","Things to learn"],["make","Things to make"],["do","Experiences"],["read","Books & films"]].map(([id,name])=>({id,name}))};
    S.growth={skills:[],ledger:[]};S.tpl={items:[]};savePlan();saveLists();saveGrowth();saveTpl();go("plan","today")},
  nobanner:()=>{lsSet("lifecompass-nobanner","1");render()},
  theme:v=>{lsSet(TKEY,v==="auto"?null:v);applyTheme();render()},
  syncconnect:async()=>{const i=$("#sync-token");const tok=i&&i.value.trim();if(!tok)return;setStatus("Connecting to GitHub…");
    try{const res=await Sync.connect(tok);
      if(res.found&&res.remote){if(!S.plan||!hasData()||confirm("Found your Life Compass data on GitHub.\n\nOK — load it on this device (replaces what's here)\nCancel — merge it with what's on this device"))applyData(res.remote);else mergeIn(res.remote);localPut()}
      S.loaded=true;setStatus(res.found?"Connected — your data is here ✓":"Connected — sync is on ✓");await Sync.run();render()}
    catch(e){Sync.disconnect();setStatus(e.status===401?"That token didn't work — check it and that the gist box was ticked":"Couldn't connect: "+e.message);render()}},
  syncnow:async()=>{setStatus("Syncing…");await Sync.run();render()},
  syncoff:()=>{if(!confirm("Stop syncing on this device? Your data stays here and on GitHub."))return;Sync.disconnect();setStatus("Sync off on this device");render()},
  export:()=>{flushLocal();const b=new Blob([JSON.stringify(snapshot(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="life-compass-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);setStatus("Backup downloaded")}
};
async function importFile(f){
  try{const o=JSON.parse(await f.text());if(!o||typeof o!=="object"||!("plan" in o||"tasks" in o||"days" in o))throw new Error("not a Life Compass backup");
    if(!confirm("Replace the data on this device with this backup?"))return;
    applyData(o);const now=Date.now();Object.keys(DOCS).forEach(k=>{if(S[k])S[k]._t=now});COLS.forEach(c=>Object.values(S[c]).forEach(x=>{if(x&&typeof x==="object")x._t=now}));
    if(db){Object.keys(DOCS).forEach(saveDoc);COLS.forEach(c=>Object.keys(S[c]).forEach(id=>saveC(c,id)))}else{localPut();Sync.soon()}
    S.loaded=true;setStatus("Backup restored ✓");go("plan","today")}
  catch(e){setStatus("Couldn't read that file: "+e.message)}
}
document.addEventListener("click",e=>{
  document.querySelectorAll("details.sym[open]").forEach(d=>{if(!d.contains(e.target))d.open=false});
  if(e.target.closest("#fab")){ACT.capopen();return}
  const n=e.target.closest("[data-nav]");if(n){go(n.dataset.nav);return}
  const b=e.target.closest("[data-act]");if(!b||!b.closest("#main,#sheet"))return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v,b)}
});
function onInput(e){
  const t=e.target,ds=t.dataset;
  if(ds.b){if(t.tagName==="SELECT"||t.type==="date"||t.type==="time")return;const[kind,key,field]=ds.b.split("|");setField(kind,key,field,t.value);if(t.tagName==="TEXTAREA"){t.style.height="auto";t.style.height=Math.max(44,t.scrollHeight+2)+"px"}return}
  if(ds.num){const k=ymd(S.date),d=dayDoc(k);if(t.value==="")delete d.v[ds.num];else d.v[ds.num]=Number(t.value);saveDay(k);return}
  if(ds.noteq){S.noteQ=t.value;const l=$("#notelist");if(l)l.innerHTML=noteList();return}
  if(ds.doneq){S.doneQ=t.value;const l=$("#donelist");if(l){const x=document.createElement("div");x.innerHTML=vDone();l.innerHTML=x.querySelector("#donelist").innerHTML}return}
  if(ds.ctarget){S.plan.circles=S.plan.circles||{};S.plan.circles[ds.ctarget]=Object.assign({},circ(ds.ctarget),{target:Number(t.value)||0});savePlan();return}
}
function onChange(e){
  const t=e.target,ds=t.dataset;
  if(ds.b&&(t.tagName==="SELECT"||t.type==="date"||t.type==="time")){const[kind,key,field]=ds.b.split("|");setField(kind,key,field,t.value);return}
  if(ds.symin){const v=t.value.trim();if(v)setSym(ds.symin,v);return}
  if(ds.libstatus){const x=(S.lists.library||[]).find(i=>i.id===ds.libstatus);if(x){x.status=t.value;if(t.value==="done")x.doneAt=today();saveLists();render()}return}
  if(ds.goalh){const g=(S.lists.goals||[]).find(x=>x.id===ds.goalh);if(g){g.horizon=t.value;saveLists();render()}return}
  if(ds.jump&&t.value){S.date=parse(t.value);render()}
  if(ds.import&&t.files&&t.files[0]){importFile(t.files[0]);t.value=""}
}
["#main","#sheet"].forEach(sel2=>{const el=$(sel2);el.addEventListener("input",onInput);el.addEventListener("change",onChange);el.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.dataset.enter){e.preventDefault();const[a,v]=t.dataset.enter.split(":");if(ACT[a])ACT[a](v)}if(e.key==="Escape"&&S.cap){ACT.capclose()}})});
$("#main").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.areadet){if(d.open)S.openArea=d.dataset.areadet;else if(S.openArea===d.dataset.areadet)S.openArea=null}},true);
window.addEventListener("resize",()=>{if(S.view==="growth"&&S.sub.growth==="milestones")drawLife()});
init();
})();
</script>

</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Compass</title>
<meta name="description" content="Plan, review, grow and reflect — gently, on any device.">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
/* Soft, bright, quiet. Each section has its own pastel; everything else stays out of the way. */
:root{
  --bg:#FAF7F2;--surface:#FFFFFF;--soft:#F3EFE9;--ink:#2E2B33;--muted:#8C8693;--faint:#BDB7C2;--line:#EEE8E1;
  --plan:#6C9BC9;--plan-t:#E2EDF8;--review:#D88F5C;--review-t:#FBE8D8;--growth:#57A07A;--growth-t:#DCEFE3;--reflect:#8D7FCF;--reflect-t:#EAE6F8;
  --m1:#E9A3A8;--m2:#F1BE97;--m3:#EDD58C;--m4:#A6D6AF;--m5:#92C4E9;
  --blob:#F9E4DC;--danger:#C9615F;--now:#E4846F;--money:#BC8E3A;--money-t:#F7ECD7;--pos:#3D9468;--neg:#CF6A55;
  --shadow:0 1px 2px rgba(46,43,51,.04),0 6px 22px rgba(46,43,51,.06);
  --shadow-lg:0 18px 50px rgba(46,43,51,.16);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--plan);--tint:var(--plan-t);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161C;--surface:#211F28;--soft:#2A2832;--ink:#ECE8F2;--muted:#9C97A8;--faint:#5E596A;--line:#2F2C37;
  --plan:#93B9E0;--plan-t:#1E2836;--review:#E8AD82;--review-t:#33281F;--growth:#86C3A2;--growth-t:#1C2C24;--reflect:#B3A7EA;--reflect-t:#29253D;
  --money:#E2BD78;--money-t:#33291B;--pos:#86C9A4;--neg:#F0A08C;--blob:#2A2130;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);--shadow-lg:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161C;--surface:#211F28;--soft:#2A2832;--ink:#ECE8F2;--muted:#9C97A8;--faint:#5E596A;--line:#2F2C37;
  --plan:#93B9E0;--plan-t:#1E2836;--review:#E8AD82;--review-t:#33281F;--growth:#86C3A2;--growth-t:#1C2C24;--reflect:#B3A7EA;--reflect-t:#29253D;
  --money:#E2BD78;--money-t:#33291B;--pos:#86C9A4;--neg:#F0A08C;--blob:#2A2130;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);--shadow-lg:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}
body[data-tab="review"]{--accent:var(--review);--tint:var(--review-t)}
body[data-tab="growth"]{--accent:var(--growth);--tint:var(--growth-t)}
body[data-tab="reflect"]{--accent:var(--reflect);--tint:var(--reflect-t)}
body[data-tab="money"]{--accent:var(--money);--tint:var(--money-t)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 var(--sans);color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 42vmax at -5% -10%,var(--tint),transparent 70%),radial-gradient(50vmax 36vmax at 105% 4%,var(--blob),transparent 70%)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:1180px}
main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}

/* header */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 18px 4px;max-width:680px;margin:0 auto}
body.widehead header.top{max-width:1180px}
.hello{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
.todayline{color:var(--muted);font-size:14px;margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.ring{width:16px;height:16px}.ring circle{fill:none;stroke-width:2.4}.ring .rb{stroke:var(--line)}.ring .rf{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn[aria-pressed="true"]{color:var(--accent);background:var(--tint)}
.iconbtn .syncdot{position:absolute;top:8px;right:8px}

/* tabs: thumb-reach bar on phones, quiet row on wider screens */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;transition:background .2s,color .2s}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--tint)}
@media (min-width:760px){
  nav.tabs{position:static;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 18px 0}
  nav.tabs button{flex:none;max-width:none;flex-direction:row;gap:8px;font-size:14.5px;padding:9px 18px}
  main{padding-bottom:48px}
}

/* scope + period */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 4px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:1px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--muted);font-weight:500;white-space:nowrap;transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pnav{display:flex;align-items:flex-end;gap:8px;margin:16px 2px 12px}
.pnav h2,.h2{font-family:var(--serif);font-weight:500;font-size:31px;margin:0;letter-spacing:-.015em;line-height:1.1}
.pnav>div:first-child{min-width:0}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.pnav .arrows{margin-left:auto;display:flex;align-items:center;gap:0;flex:none}
.pnav .arrows .iconbtn{width:36px}
.viewtog{display:inline-flex;background:var(--soft);border-radius:12px;padding:2px;margin-right:4px}
.viewtog button{width:34px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.viewtog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.viewtog svg.i{width:18px;height:18px}
.link{color:var(--accent);font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:10px}
.link:hover{background:var(--tint)}

/* lists */
.add{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);margin:6px 0 16px}
.add input{flex:1;border:0;outline:0;background:none;padding:10px 0;font-size:16px;min-width:0}
.add button{width:38px;height:38px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 15px;border-top:1px solid var(--line);transition:opacity .3s}
.task:first-child{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;transition:all .2s}
.tick:hover{border-color:var(--accent)}
.tick svg{width:13px;height:13px;stroke-width:2.8}
.task.done .tick,.task.ticking .tick{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.task.ticking .tick{animation:pop .35s}
.evdot{width:22px;height:22px;flex:none;display:grid;place-items:center;margin-top:1px}
.evdot::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.repic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.repic svg.i{width:16px;height:16px}
@keyframes pop{50%{transform:scale(1.25)}}
textarea.ttext{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;padding:1px 4px;margin:-1px -4px;font-size:15px;line-height:1.5;overflow:hidden;border-radius:6px;display:block;height:24px}
textarea.ttext:focus{background:var(--soft)}
.task.done .ttext,.task.ticking .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.chip{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px;flex:none;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.late{color:var(--review);background:var(--review-t)}
.more{width:28px;height:28px;border-radius:8px;color:var(--faint);display:grid;place-items:center;flex:none;margin:-3px 0}
.more:hover{background:var(--soft);color:var(--ink)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 4px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button.label{width:calc(100% - 8px)}
.empty{padding:24px 20px;color:var(--muted);text-align:center;font-family:var(--serif);font-style:italic;font-size:16.5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.week button{background:var(--surface);border-radius:14px;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted)}
.week b{font-size:16px;color:var(--ink);font-weight:600}
.week .on{background:var(--tint)}.week .on b{color:var(--accent)}
.dots{display:flex;gap:3px;height:6px;align-items:center}.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75}
.more-btn{display:block;margin:6px auto 0;color:var(--muted);font-size:14px;padding:10px 16px;border-radius:12px}
.more-btn:hover{background:var(--soft);color:var(--ink)}

/* calendar */
.cal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;--gut:44px}
.cal-head,.allday,.cal-grid{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line)}
.ch{padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:1px}
.ch b{font-size:15px;color:var(--ink);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.ch.today b{background:var(--accent);color:var(--surface)}
.allday{border-bottom:1px solid var(--line);padding:4px 0}
.allday .lbl{font-size:10px;color:var(--faint);text-align:right;padding:4px 6px 0 0;line-height:1.1}
.ad{display:flex;flex-direction:column;gap:2px;padding:0 2px;min-width:0}
.adc{font-size:11.5px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 30%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;width:100%}
.adc.done{opacity:.5;text-decoration:line-through}
.adc.plus{background:none;color:var(--muted);padding:0 6px}
.cal-scroll{height:calc(100dvh - 400px);min-height:340px;overflow-y:auto;overscroll-behavior:contain;position:relative}
@media (min-width:760px){.cal-scroll{height:calc(100dvh - 340px)}}
.cal-grid{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.hours{position:relative}
.hours span{position:absolute;right:7px;font-size:10.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.hours span:first-child{display:none}
.col{position:relative;border-left:1px solid var(--line);cursor:pointer}
.blk{position:absolute;border-radius:8px;padding:3px 6px;background:color-mix(in srgb,var(--c) 32%,var(--surface));border-left:3px solid var(--c);font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;text-align:left;transition:box-shadow .15s}
.blk b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk.short{display:flex;gap:6px;align-items:center;padding-top:1px;padding-bottom:1px}
.blk.short b{flex:1;min-width:0}
.blk.done{opacity:.5}.blk.done b{text-decoration:line-through}
.blk.lift{box-shadow:var(--shadow-lg);z-index:6;opacity:.96}
.blk .rs{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
@media (max-width:600px){.cal.multi{--gut:32px}.cal.multi .blk{padding:2px 3px;font-size:10.5px;border-left-width:2px;border-radius:6px}.cal.multi .blk b{white-space:normal;overflow-wrap:anywhere;line-height:1.2}.cal.multi .blk span{display:none}.cal.multi .adc{font-size:10px;padding:1px 3px}.cal.multi .hours span{font-size:9.5px;right:4px}}
.calhint{font-size:12.5px;color:var(--muted);margin:10px 4px 0;text-align:center}
.month{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.mh{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc{min-height:86px;padding:4px 3px 5px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;align-items:stretch}
.mc:nth-child(-n+7){border-top:0}
.mc:nth-child(7n+1){border-left:0}
.mc .dn{font-size:12px;font-weight:600;align-self:center;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex:none}
.mc.today .dn{background:var(--accent);color:var(--surface)}
.mc.out{opacity:.4}
.mc i{font-style:normal;font-size:10.5px;line-height:1.35;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--c) 30%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc i.done{opacity:.5;text-decoration:line-through}
.mc em{font-style:normal;font-size:10px;color:var(--muted);padding-left:4px}

/* review */
.mood{display:flex;gap:6px;justify-content:space-between;background:var(--surface);border-radius:18px;padding:16px 10px 12px;box-shadow:var(--shadow)}
.mood button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mood i{width:34px;height:34px;border-radius:50%;background:var(--c);opacity:.4;transition:all .25s;display:block}
.mood button:hover i{opacity:.7}
.mood button[aria-pressed="true"] i{opacity:1;transform:scale(1.1);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--c)}
.mood button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.field{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 12px;margin-top:12px;display:block}
.field>span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:3px}
textarea.auto{width:100%;border:0;outline:0;background:none;resize:none;min-height:26px;font-size:16px;line-height:1.6;padding:0;overflow:hidden;display:block}
.rituals{display:flex;flex-wrap:wrap;gap:8px}
.rit{padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;display:inline-flex;gap:7px;align-items:center;transition:all .2s}
.rit i{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;color:transparent}
.rit i svg{width:11px;height:11px;stroke-width:3}
.rit[aria-pressed="true"]{background:var(--growth-t);color:var(--growth)}
.rit[aria-pressed="true"] i{background:var(--growth);border-color:var(--growth);color:var(--surface)}
.rhythm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.rhythm button{width:16px;height:16px;border-radius:50%;background:var(--line)}
.rhythm button.fut{opacity:.35}
.rhythm button.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rhythm.months button{width:auto;height:auto;border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink)}
details.field summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.field summary::-webkit-details-marker{display:none}
.win{font-family:var(--serif);font-size:17px}
.donelist{margin:10px 0 2px;padding:0;list-style:none;color:var(--muted);font-size:14.5px}
.donelist li{padding:5px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.donelist li::before{content:"✓";color:var(--growth)}

/* reflect */
.quick{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 10px;margin:18px 0 18px}
.quick textarea{font-family:var(--serif);font-size:19px;line-height:1.5;min-height:58px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.kinds{display:flex;gap:2px}
.kind{padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.kind[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.btn{background:var(--accent);color:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg.i{width:16px;height:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.tint{background:var(--tint);color:var(--accent)}
.btn.danger{background:none;color:var(--danger);padding-left:6px;padding-right:6px}
.btn:disabled{opacity:.5}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.tools .btn{height:38px}
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:0 10px;box-shadow:var(--shadow);color:var(--muted);height:38px;flex:1;min-width:0}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink);font-size:16px}
.entry{display:block;width:100%;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;transition:transform .15s}
.entry:hover{transform:translateY(-1px)}
.eh{display:flex;gap:9px;align-items:center}
.eh h3{margin:0;font-size:15.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.otitle{font-family:var(--serif);font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 6px}
.editor{max-width:680px;margin:0 auto;padding:6px 24px 90px}
.when{color:var(--muted);font-size:13px}

.settings input.tok{flex:1;min-width:0;border:0;outline:0;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px}
.ritrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ritrow:first-child{border-top:0}.ritrow span{flex:1}
.ok{color:var(--growth)}.bad{color:var(--danger)}

.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(30,26,36,.3);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 8px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet-back{align-items:center}.sheet{border-radius:22px;padding-bottom:12px}}
textarea.stitle{font-size:19px;font-weight:500;padding:2px 12px 6px;font-family:var(--serif)}
.sl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 12px 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px;align-items:center}
.chips button{padding:6px 12px;border-radius:999px;background:var(--soft);font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--tint);color:var(--accent);font-weight:600}
.frow{display:flex;gap:8px;align-items:center;padding:0 12px;flex-wrap:wrap}
.chips input,.frow input,.frow select{border:0;background:var(--soft);border-radius:10px;padding:7px 10px;color:var(--ink);font-size:15px;min-height:34px}

.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.sact{display:flex;gap:8px;align-items:center;padding:18px 12px 4px;flex-wrap:wrap}
.sact .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;display:flex;gap:16px;align-items:center;z-index:95;box-shadow:var(--shadow-lg);animation:fade .2s;max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.wcard.on{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.wcard.hid{opacity:.5}
.wcard.add{min-width:0;flex-direction:row;align-items:center;gap:6px;color:var(--muted);padding:10px 16px}

.msum span{display:block;font-size:12px;color:var(--muted)}
.msum b{font-size:18px;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

.dayhead{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin:18px 6px 7px;font-weight:600}
.dayhead b{font-variant-numeric:tabular-nums}
.txrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 15px;border-top:1px solid var(--line)}

.txrow:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.txm{flex:1;min-width:0;display:flex;flex-direction:column}
.txm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txm small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.crow{padding:12px 10px 12px 15px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 6px;align-items:center}
.list>.crow:first-child{border-top:0}
.crow.zero{opacity:.55}
.cmain{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--c);border-radius:3px}
.cbar.over i{background:var(--neg)}
.crow small{font-size:12.5px;color:var(--muted);grid-column:1/2}
.crow small.neg{color:var(--neg);font-weight:600}
.amtwrap{display:flex;align-items:baseline;gap:8px;padding:8px 12px 0}
.amtin{flex:1;min-width:0;border:0;outline:0;background:none;font:500 38px/1.15 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
#tcur{color:var(--muted);font-size:15px;font-weight:600}
.frow input.wide{flex:1;min-width:0}
.dotchip{display:inline-flex;align-items:center;gap:6px}
.dotchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.dotchip.add::before{display:none}
.hint{margin:5px 12px 0;color:var(--muted);font-size:12.5px}

/* mind map */
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 2px 12px}
.mapwrap{position:relative;height:calc(100dvh - 250px);min-height:380px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}

.overlay.mapov{overflow:hidden;display:flex;flex-direction:column}
.overlay.mapov .mapwrap{flex:1;height:auto;min-height:0;border-radius:0;box-shadow:none;background:transparent}
.mm-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;outline:0;cursor:grab;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px}
.mm-viewport.panning{cursor:grabbing}
.mm-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.mm-canvas.smooth{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mm-lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.mm-lines path{fill:none;stroke-linecap:round;opacity:.9}
.mm-node{position:absolute;left:0;top:0;white-space:pre-wrap;word-break:break-word;max-width:250px;width:max-content;cursor:pointer;user-select:none;-webkit-user-select:none;outline:0;transition:box-shadow .15s;line-height:1.35}
.mm-node.d0{background:var(--ink);color:var(--bg);font-family:var(--serif);font-size:20px;font-weight:500;padding:13px 26px;border-radius:20px;max-width:300px;text-align:center}
.mm-node.d1{background:color-mix(in srgb,var(--c) 32%,var(--surface));border:1.5px solid var(--c);font-weight:600;font-size:15px;padding:8px 16px;border-radius:14px}
.mm-node.d2{padding:3px 4px 5px;font-size:14px;border-bottom:2px solid var(--c)}
.mm-node.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.mm-node.d2.sel{border-radius:6px}
.mm-node.editing{user-select:text;-webkit-user-select:text;cursor:text;min-width:60px}
.mm-node:empty::before{content:"Type an idea";color:var(--faint);font-weight:400}
.mm-node.d0:empty::before{color:var(--muted)}
.mm-node[data-n]::after{content:attr(data-n);position:absolute;top:50%;right:-28px;transform:translateY(-50%);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--c);color:var(--ink);font:600 11px/20px var(--sans);text-align:center}
.mm-node[data-side="-1"][data-n]::after{right:auto;left:-28px}
.mm-tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:4px;box-shadow:var(--shadow-lg);z-index:2}
.mm-tools button{width:42px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.mm-tools button:hover{background:var(--soft)}
.mm-tools button:disabled{opacity:.28;pointer-events:none}
.mm-tools .sepr{width:1px;background:var(--line);margin:8px 3px}
.mm-hint{position:absolute;left:16px;top:14px;font-size:12.5px;color:var(--muted);pointer-events:none;max-width:60%}
@media (max-width:600px){.mm-hint{display:none}}

/* presentation */
.pz{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;animation:fade .3s}
.pz-stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:9vh 8vw 16vh;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.slide::before{content:"";position:absolute;inset:-10%;z-index:-1;background:radial-gradient(45% 45% at 12% 18%,color-mix(in srgb,var(--c) 42%,transparent),transparent 70%),radial-gradient(40% 40% at 92% 88%,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%)}
.slide.enter-r{opacity:0;transform:translateX(48px)}.slide.enter-l{opacity:0;transform:translateX(-48px)}
.slide.leave-l{opacity:0;transform:translateX(-48px)}.slide.leave-r{opacity:0;transform:translateX(48px)}
.crumbs{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;min-height:1em}
.slide h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6.4vw,78px);line-height:1.04;letter-spacing:-.025em;margin:0 0 6vh;max-width:16ch}
.slide h1::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--c);margin-top:24px}
.slide.root{align-items:center;text-align:center}
.slide.root h1{max-width:20ch}.slide.root h1::after{margin-left:auto;margin-right:auto}
.slide.root .cards{justify-content:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px;max-width:1120px;width:100%}
.slide.few .cards{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),340px))}
.pcard{background:color-mix(in srgb,var(--c) 24%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:22px;padding:18px 22px;text-align:left;font-size:clamp(16px,1.55vw,21px);font-weight:500;line-height:1.35;opacity:0;transform:translateY(16px);animation:card .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 70ms + 180ms)}
.pcard.go{cursor:pointer}.pcard.go:hover{box-shadow:var(--shadow)}
.pcard ul{margin:10px 0 0;padding:0;list-style:none;font-size:.76em;font-weight:400;color:var(--muted)}
.pcard li{padding:2px 0}.pcard li::before{content:"·";margin-right:7px;color:var(--ink)}
@keyframes card{to{opacity:1;transform:none}}
.pz-prog{position:absolute;left:0;top:0;height:3px;background:var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1),background .5s;z-index:3}
.pz-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3}
.pz-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 14px calc(18px + env(safe-area-inset-bottom));color:var(--muted);font-size:13px;z-index:3;font-variant-numeric:tabular-nums}
.pz-bar button{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pz-bar button:hover{background:var(--surface)}
.boot{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
(function(){
"use strict";
/* ======== helpers ======== */
const $=(s,r=document)=>r.querySelector(s);

/* drag to move · drag the bottom edge to resize · on touch, hold first so scrolling still works */
function calDown(e){

  const grid=b.closest(".cal-grid"),gr=grid.getBoundingClientRect(),s=toMin(t.time),dur=t.dur||60;
  drag={b,t,grid,k:b.dataset.k,mode:e.target.classList.contains("rs")?"resize":"move",x:e.clientX,y:e.clientY,s,dur,ns:s,nd:dur,nk:b.dataset.k,on:false,moved:false,
    touch:e.pointerType!=="mouse",off:(e.clientY-gr.top)/HOUR*60-s,timer:null};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.on){drag.on=true;b.classList.add("lift");try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}},320);

function calMove(e){
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(drag.touch){if(Math.hypot(dx,dy)>8){clearTimeout(drag.timer);drag=null}return}if(Math.hypot(dx,dy)<4)return;drag.on=true;drag.b.classList.add("lift")}

  const sc=drag.grid.parentElement,sr=sc.getBoundingClientRect();if(e.clientY<sr.top+30)sc.scrollTop-=10;else if(e.clientY>sr.bottom-30)sc.scrollTop+=10;
  if(drag.mode==="move"){drag.ns=clamp(snap(m-drag.off),0,1440-15);drag.b.style.top=drag.ns*HOUR/60+"px";
    if(!drag.t.rep){const col=$$(".col",drag.grid).find(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<r.right});
      if(col&&col.dataset.k!==drag.nk){drag.nk=col.dataset.k;col.appendChild(drag.b);drag.b.style.left="2px";drag.b.style.width="calc(100% - 4px)"}}}
  else{drag.nd=clamp(snap(m)-drag.s,15,1440-drag.s);drag.b.style.height=Math.max(drag.nd,20)*HOUR/60-2+"px"}
  const sp=drag.b.querySelector("span");if(sp)sp.textContent=fromMin(drag.ns)+"–"+fromMin(Math.min((drag.mode==="move"?drag.ns+drag.dur:drag.s+drag.nd),1439));

function calUp(){

/* ======== Money: wallets, categories, spending and income ======== */
/* Amounts are kept as whole minor units (pence, cents, tiyn) so every sum is exact.
   A transaction is {id,date,kind:"out"|"in"|"move",amt,wallet,to,amtTo,cat,note,tag,created};
   wallets and categories are records in `fin` ({type:"wallet"|"cat"}). A move takes money out of
   `wallet` and puts it into `to` (amtTo when the two wallets use different currencies). */
const CURS=["GBP","EUR","USD","KZT","TRY","RUB","UZS","KGS","AED","SAR"];
const FIN_SEED={wallets:[["w-personal","Personal",5],["w-service","Service · community",1]],
  out:[["c-food","Food",0],["c-transport","Transport",5],["c-home","Home & bills",2],["c-health","Health",1],["c-study","Study",4],["c-gifts","Gifts",6],["c-community","Community",3],["c-other","Other",2]],
  in:[["c-salary","Work & salary",1],["c-freelance","Freelance",5],["c-servicein","Service funds received",3],["c-giftin","Gifts received",6],["c-otherin","Other income",2]]};
/* everyday words that point to the starter categories, so "12 lunch" lands in Food */
const CAT_WORDS={"c-food":"lunch dinner breakfast coffee cafe café tea grocer groceries tesco lidl aldi sainsbury asda market restaurant snack meal food pizza bread",
  "c-transport":"bus train taxi uber bolt tube oyster fuel petrol diesel parking ticket flight metro","c-home":"rent bill bills electric electricity gas water internet wifi phone council laundry",
  "c-health":"pharmacy doctor dentist gym medicine vitamins","c-study":"book books course uni tuition stationery printing","c-gifts":"gift present flowers",
  "c-community":"community service sohbet program upgrade hall","c-salary":"salary wage wages pay payroll","c-servicein":"fund funds","c-freelance":"client invoice editing filming"};
function seedFin(){if(Object.keys(S.fin).length)return;const put=r=>{r._t=0;S.fin[r.id]=r;dirty.add("fin/"+r.id)};
  FIN_SEED.wallets.forEach(([id,name,c],i)=>put({id,type:"wallet",name,cur:"GBP",start:0,color:c,order:i,note:""}));
  ["out","in"].forEach(k=>FIN_SEED[k].forEach(([id,name,c],i)=>put({id,type:"cat",kind:k,name,color:c,budget:0,order:i,note:""})));
  put({id:"c-adjust",type:"cat",kind:"adj",name:"Balance adjustment",color:2,order:99,note:""})}
const finList=t=>Object.values(S.fin).filter(r=>r.type===t).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name)));
const wallets=all=>finList("wallet").filter(w=>all||!w.hidden);
const cats=(kind,all)=>finList("cat").filter(c=>c.kind===kind&&(all||!c.hidden));
const curOf=wid=>(S.fin[wid]&&S.fin[wid].cur)||"GBP";
const nf={};
function money(m,cur,plus){cur=cur||"GBP";m=m||0;const whole=m%100===0,k=cur+(whole?"0":"2");
  if(!nf[k]){try{nf[k]=new Intl.NumberFormat("en-GB",{style:"currency",currency:cur,minimumFractionDigits:whole?0:2,maximumFractionDigits:2})}catch(e){nf[k]={format:v=>v.toFixed(whole?0:2)+" "+cur}}}
  return(m<0?"−":plus&&m>0?"+":"")+nf[k].format(Math.abs(m)/100)}
/* "12.50", "12,50", "£1,200", "12+3.40" → minor units; NaN when it isn't a number */
function parseAmt(s){s=String(s==null?"":s).replace(/[£$€₸₺₽\s]/g,"").replace(/,(?=\d{1,2}$)/,".").replace(/,/g,"");
  if(!s||!/^[+-]?(\d+\.?\d*|\.\d+)([+-](\d+\.?\d*|\.\d+))*$/.test(s))return NaN;let tot=0;
  for(const m of s.matchAll(/([+-]?)(\d+\.?\d*|\.\d+)/g)){const v=Math.round(parseFloat(m[2])*100);tot+=m[1]==="-"?-v:v}return tot}
const amtStr=m=>m?(m%100?(m/100).toFixed(2):String(m/100)):"";
function balances(){const b={};wallets(true).forEach(w=>b[w.id]=w.start||0);
  for(const id in S.tx){const t=S.tx[id];
    if(t.kind==="in")b[t.wallet]=(b[t.wallet]||0)+t.amt;else if(t.kind==="out")b[t.wallet]=(b[t.wallet]||0)-t.amt;
    else{b[t.wallet]=(b[t.wallet]||0)-t.amt;if(t.to)b[t.to]=(b[t.to]||0)+(t.amtTo||t.amt)}}
  return b}
function moneyPeriod(){const st=UI.money;return st.scope==="all"?{scope:"all",key:"all",s:"0000-01-01",e:"9999-12-31",title:"All time",sub:"Everything recorded",cur:true}:period(st.scope,st.at)}
function txFor(P){const st=UI.money,w=st.wallet;const out=[];
  for(const id in S.tx){const t=S.tx[id];if(t.date<P.s||t.date>P.e)continue;if(w!=="all"&&t.wallet!==w&&t.to!==w)continue;if(st.cat&&t.cat!==st.cat)continue;if(st.tag&&t.tag!==st.tag)continue;out.push(t)}
  return out}
/* what a transaction does to the wallet(s) on screen: income +, spending −, transfers only count inside one wallet */
function effect(t){const w=UI.money.wallet;
  if(t.kind==="in")return{cur:curOf(t.wallet),v:t.amt,k:"in"};if(t.kind==="out")return{cur:curOf(t.wallet),v:-t.amt,k:"out"};
  if(w==="all")return{cur:curOf(t.wallet),v:0,k:"move"};
  if(t.wallet===w)return{cur:curOf(w),v:-t.amt,k:"tout"};return{cur:curOf(w),v:t.amtTo||t.amt,k:"tin"}}
function totals(list){const T={};list.forEach(t=>{const e=effect(t),x=T[e.cur]=T[e.cur]||{in:0,out:0,tin:0,tout:0,net:0};
  if(e.k==="in")x.in+=e.v;else if(e.k==="out")x.out-=e.v;else if(e.k==="tin")x.tin+=e.v;else if(e.k==="tout")x.tout-=e.v;x.net+=e.v});return T}
function lastWallet(){const st=UI.money;if(st.wallet!=="all"&&S.fin[st.wallet])return st.wallet;const l=lsGet("compass-lastw");return S.fin[l]&&!S.fin[l].hidden?l:(wallets()[0]||{}).id||""}
function lastCat(kind){const l=lsGet("compass-lastc-"+kind);return S.fin[l]&&!S.fin[l].hidden&&S.fin[l].kind===kind?l:(cats(kind)[0]||{}).id||""}
function defaultTxDate(){const st=UI.money,t=todayK();if(st.scope==="day")return keyOf("day",st.at);if(st.scope==="all")return t;const P=period(st.scope,st.at);return t>=P.s&&t<=P.e?t:P.s}
/* pick a category: the one used last time for the same words, then a category name, then everyday words, then the last one used */
function guessCat(kind,text){
  const low=String(text||"").trim().toLowerCase();if(low){let best=null;for(const id in S.tx){const t=S.tx[id];if(t.kind===kind&&t.cat&&String(t.note||"").toLowerCase()===low&&(!best||t.created>best.created))best=t}if(best&&S.fin[best.cat]&&!S.fin[best.cat].hidden)return best.cat}
  const words=low.split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>=3);
  if(words.length){const list=cats(kind);
    /* the first word you type decides: "sohbet tea" is community, "tea for sohbet" is food */
    for(const w of words){
      const byName=list.find(c=>c.name.toLowerCase().split(/[^\p{L}]+/u).some(x=>x.length>=3&&(x.startsWith(w)||w.startsWith(x))));if(byName)return byName.id;

  if(m){sign=m[1];amt=m[2];text=m[3]}else{m=s.match(/^(.*?)\s+([+-]?)([£$€₸₺₽]?\d[\d.,]*)$/);if(!m)return null;text=m[1];sign=m[2];amt=m[3]}
  const a=Math.abs(parseAmt(amt));if(!a)return null;const kind=sign==="+"?"in":"out";text=text.trim();

  return{edit:(id,init)=>{render();edit(id,init)},fit,destroy(){alive=false;cancelAnimationFrame(raf)}};
}

/* ======== Presentation (XMind "pitch"-style: one topic per slide, its ideas as cards) ======== */
function present(root){
  const slides=[],idx=new Map();
  (function walk(n,path,color){const kids=n.children||[];if(!path.length||kids.length){idx.set(n.id,slides.length);slides.push({n,path,color})}
    kids.forEach((c,i)=>walk(c,path.concat(n.text),path.length?color:PAL[i%PAL.length]))})(root,[],PAL[2]);
  const z=document.createElement("div");z.className="pz";z.setAttribute("role","dialog");z.setAttribute("aria-label","Presentation");
  z.innerHTML=`<div class="pz-prog"></div><button class="iconbtn pz-close" data-p="close" aria-label="Close presentation">${icon("x")}</button><div class="pz-stage"></div>
    <div class="pz-bar"><button data-p="prev" aria-label="Previous">${icon("left")}</button><span class="pz-count"></span><button data-p="next" aria-label="Next">${icon("right")}</button></div>`;
  document.body.appendChild(z);document.body.classList.add("locked");
  let i=-1;
  const card=(c,j,color)=>{const kids=c.children||[];return`<div class="pcard${kids.length?" go":""}" style="--i:${j};--c:${color}"${kids.length?` data-goto="${idx.get(c.id)}"`:""}><div>${esc(c.text)}</div>${kids.length?`<ul>${kids.slice(0,4).map(k=>`<li>${esc(k.text)}</li>`).join("")}${kids.length>4?`<li>${kids.length-4} more</li>`:""}</ul>`:""}</div>`};
  function show(n){
    if(n<0||n>=slides.length||n===i)return;const dir=n>i?1:-1,old=$(".slide:not(.leaving)",z);i=n;const s=slides[n],isRoot=!s.path.length,kids=s.n.children||[];
    const el=document.createElement("section");el.className="slide"+(isRoot?" root":"")+(kids.length<=3?" few":"")+(dir>0?" enter-r":" enter-l");el.style.setProperty("--c",s.color);
    el.innerHTML=`<div class="crumbs">${s.path.map(esc).join(" &nbsp;›&nbsp; ")}</div><h1>${esc(s.n.text||"Untitled")}</h1><div class="cards">${kids.map((c,j)=>card(c,j,isRoot?PAL[j%PAL.length]:s.color)).join("")}</div>`;
    $(".pz-stage",z).appendChild(el);el.getBoundingClientRect();requestAnimationFrame(()=>el.classList.remove("enter-r","enter-l"));
    if(old){old.classList.add("leaving",dir>0?"leave-l":"leave-r");setTimeout(()=>old.remove(),600)}
    z.style.setProperty("--c",s.color);$(".pz-count",z).textContent=(n+1)+" / "+slides.length;$(".pz-prog",z).style.width=((n+1)/slides.length*100)+"%";
  }
  const close=()=>{document.removeEventListener("keydown",key,true);const ix=layers.indexOf(close);if(ix>-1)layers.splice(ix,1);
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});z.remove();if(!$(".overlay"))document.body.classList.remove("locked")};
  const key=e=>{const k=e.key;
    if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k)){e.preventDefault();e.stopPropagation();show(i+1)}
    else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){e.preventDefault();e.stopPropagation();show(i-1)}
    else if(k==="Home"){e.preventDefault();show(0)}else if(k==="End"){e.preventDefault();show(slides.length-1)}
    else if(k==="Escape"){e.preventDefault();e.stopPropagation();close()}};
  document.addEventListener("keydown",key,true);layers.push(close);
  let sx=null,swiped=false;
  z.addEventListener("pointerdown",e=>{sx=e.clientX;swiped=false});
  z.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50){swiped=true;show(i+(dx<0?1:-1))}});
  z.addEventListener("click",e=>{if(swiped){swiped=false;return}const p=e.target.closest("[data-p]"),g=e.target.closest("[data-goto]");
    if(p){const a=p.dataset.p;if(a==="close")close();else show(i+(a==="next"?1:-1));return}
    if(g){show(+g.dataset.goto);return}
    show(e.clientX<innerWidth/3?i-1:i+1)});
  if(z.requestFullscreen&&matchMedia("(min-width:760px)").matches)z.requestFullscreen().catch(()=>{});
  show(0);
}

/* ======== overlays, sheets, toasts ======== */

  b.addEventListener("pointerdown",e=>{b._down=e.target===b});b.onclick=e=>{if(e.target===b&&b._down)closeSheet()};document.body.appendChild(b);layers.push(closeSheet);bind&&bind(b)}

let toastT=null;

    case"mnew":{const inp=$("#addmoney"),raw=inp?inp.value.trim():"",q=raw?parseMoneyQuick(raw):null;if(inp)inp.value="";txSheet(null,q?{kind:q.kind,amt:q.amt,note:q.note,tag:q.tag,cat:q.cat}:raw?{note:raw}:null);break}
    case"mcat":UI.money.cat=b.dataset.v;UI.money.tag="";UI.money.view="list";paintMoney();break;
    case"mcatedit":catSheet(b.dataset.v);break;
    case"mcatnew":catSheet(null,"out");break;
    case"mtag":UI.money.tag=b.dataset.v;UI.money.cat="";UI.money.view="list";paintMoney();break;
    case"mclear":UI.money.cat="";UI.money.tag="";paintMoney();break;
    case"mmore":UI.money.limit+=150;paintMoney();break;
    case"mexport":exportCSV(txFor(moneyPeriod()));break;
    case"present-growth":present(growth().root);break;
    case"qkind":UI.kind=b.dataset.v;$$("[data-act=qkind]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===UI.kind));break;
    case"qsave":saveQuick();break;
    case"filter":UI.filter=b.dataset.v;UI.limit=60;paintReflectList();break;
    case"morenotes":UI.limit+=60;paintReflectList();break;
    case"newpage":openNote(newNote(UI.kind,""),true);break;
    case"newmap":openMap(newMap(node("")),true);break;
    case"opennote":openNote(b.dataset.id);break;
  }
});
function saveQuick(){const q=$("#qw");if(!q||!q.value.trim())return;newNote(UI.kind,q.value.trim());UI.draft="";q.value="";grow(q);paintReflectList();toast("Saved to "+(UI.kind==="journal"?"your journal":UI.kind==="idea"?"ideas":"notes"))}
document.addEventListener("submit",e=>{const f=e.target;
  if(f.dataset.form==="money"){e.preventDefault();const inp=$("input",f),v=inp.value.trim();if(!v)return;inp.value="";quickMoney(v);paintMoney();return}
  if(f.dataset.form!=="task")return;e.preventDefault();const inp=$("input",f),v=inp.value.trim();if(!v)return;
  addFromInput(v);inp.value="";paintPlan();renderHeader()});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.log){const L=logOf(period(UI.review.scope,UI.review.at).key);L[el.dataset.log]=el.value;touch("logs",L.key);grow(el)}
  else if(el.classList.contains("ttext"))grow(el);
  else if(el.id==="qw"){UI.draft=el.value;grow(el)}
  else if(el.id==="rq"){UI.q=el.value;UI.limit=60;paintReflectList()}});
document.addEventListener("keydown",e=>{const el=e.target;
  if(el.classList&&el.classList.contains("ttext")){if(e.isComposing)return;
    if(e.key==="Enter"){e.preventDefault();el.blur()}else if(e.key==="Escape"){const t=S.tasks[el.closest(".task").dataset.id];el.value=t?t.text:"";el.blur()}return}
  if(el.id==="qw"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveQuick();return}
  if(e.key==="Escape"&&layers.length&&!e.defaultPrevented){e.preventDefault();layers[layers.length-1]()}});
document.addEventListener("focusout",e=>{const el=e.target;
  if(el.classList&&el.classList.contains("ttext")){const row=el.closest(".task"),t=row&&S.tasks[row.dataset.id];
    if(t){const v=el.value.replace(/\s+/g," ").trim();
      if(!v){const copy=JSON.parse(JSON.stringify(t));drop("tasks",t.id);toast("Deleted",()=>{restore("tasks",copy);afterItems()});pendingRender=true}
      else if(v!==t.text){t.text=v;touch("tasks",t.id)}}}
  if(pendingRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches("textarea.ttext")))softRender()},0)});
document.addEventListener("paste",e=>{if(!e.target.classList||!e.target.classList.contains("ttext"))return;e.preventDefault();
  const el=e.target,txt=(e.clipboardData||window.clipboardData).getData("text").replace(/\s+/g," ");el.setRangeText(txt,el.selectionStart,el.selectionEnd,"end");grow(el)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){flush();return}
  if(UI.day!==todayK()){const was=UI.day;UI.day=todayK();["plan","review"].forEach(k=>{if(ymd(UI[k].at)===was)UI[k].at=new Date()});softRender()}
  Sync.run()});
addEventListener("pagehide",()=>flush());
addEventListener("online",()=>Sync.run());
addEventListener("hashchange",()=>{const t=location.hash.slice(1).split("/")[0];if(t&&t!==UI.tab)setTab(t)});
setInterval(()=>{if(document.visibilityState==="visible")Sync.run()},60000);

/* ======== boot ======== */
(async function boot(){
  applyTheme();
  await Store.open();
  let data=null,fromLS=false;
  if(Store.db){try{data=await Store.load()}catch(e){Store.db=null}}
  if(data&&Object.keys(data).length){
    for(const k in data){if(k==="_/deleted")Object.assign(S.deleted,data[k]||{});else if(k==="_/sync")Sync.restoreState(data[k]);
      else{const i=k.indexOf("/"),c=k.slice(0,i);if(S[c]&&data[k])S[c][k.slice(i+1)]=data[k]}}
  }else{
    const raw=lsGet(LKEY);
    if(raw){try{const o=JSON.parse(raw);applyData(o);if(o.sync)Sync.restoreState(o.sync);fromLS=true}catch(e){}}
    else{const old=lsGet(OLDKEY);if(old){try{migrate(JSON.parse(old))}catch(e){console.warn("Could not bring over earlier data",e)}}
      const os=lsGet(OLDSKEY);if(os&&!Sync.cfg()){try{const c=JSON.parse(os);if(c&&c.token&&c.gist)Sync.setCfg({token:c.token,gist:c.gist})}catch(e){}}}
    if(Store.db)COLS.forEach(c=>Object.keys(S[c]).forEach(id=>dirty.add(c+"/"+id)));
  }
  if(!S.meta.growth){S.meta.growth=seedGrowth();dirty.add("meta/growth")}
  if(!S.meta.rituals){S.meta.rituals={id:"rituals",list:[],_t:0};dirty.add("meta/rituals")}
  seedFin();
  pruneDeleted();
  if(dirty.size){const ok=await flush();if(ok&&fromLS&&Store.db)lsSet(LKEY,null)}
  const h=location.hash.slice(1).split("/")[0];UI.tab=TABS.some(x=>x[0]===h)?h:(lsGet(UKEY)||"plan");
  booted=true;render();
  Sync.run();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
})();
</script>
</body>
</html>
